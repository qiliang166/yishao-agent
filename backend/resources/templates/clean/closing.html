<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:var(--background);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;">

  <!-- 内容层：居中 -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;z-index:1;">

    <!-- 感谢语 -->
    <h2 style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.2;color:var(--primary);margin:0 0 20px 0;">{{THANKS}}</h2>

    <!-- 行动号召 -->
    {{#CTA}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;font-weight:600;color:var(--accent);margin:0 0 28px 0;">{{CTA}}</p>{{/CTA}}

    <!-- 联系方式 -->
    {{#CONTACT_INFO}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--secondary);opacity:0.5;margin:0 0 8px 0;">{{CONTACT_INFO}}</p>{{/CONTACT_INFO}}

    <!-- 版权声明 -->
    {{#COPYRIGHT}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:11px;color:var(--secondary);opacity:0.35;margin:0;">{{COPYRIGHT}}</p>{{/COPYRIGHT}}
  </div>

</div>
