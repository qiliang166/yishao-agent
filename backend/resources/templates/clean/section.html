<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:var(--background);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;">

  <!-- 内容层：居中 -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;z-index:1;">

    <!-- 章节编号 -->
    {{#CHAPTER_NUM}}<div style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:400;color:var(--secondary);opacity:0.6;margin-bottom:20px;">{{CHAPTER_NUM}}</div>{{/CHAPTER_NUM}}

    <!-- 章节标题（无下划线，无装饰） -->
    <h2 style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:46px;font-weight:700;letter-spacing:-0.5px;line-height:1.2;color:var(--primary);margin:0;max-width:700px;">{{CHAPTER_TITLE}}</h2>

    <!-- 可选副标题 -->
    {{#CHAPTER_SUBTITLE}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;font-weight:400;color:var(--secondary);opacity:0.6;margin:20px 0 0 0;max-width:600px;">{{CHAPTER_SUBTITLE}}</p>{{/CHAPTER_SUBTITLE}}
  </div>

</div>
