<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BOOK_TITLE}}</title>
<style>
/* ═══ 主题变量（全部经 THEME_CSS_VARS 注入，禁止写死实值） ═══ */
:root { {{THEME_CSS_VARS}} }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--desk); }
body {
  font-family: var(--font);
  color: var(--text);
  overflow: hidden;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ═══ 幻灯片舞台：16:9 居中，等比缩放 ═══ */
.bk-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.bk-slide {
  width: 1280px; height: 720px; background: var(--background);
  position: absolute; display: none; overflow: hidden;
  transform-origin: center center;
}
.bk-slide.bk-active { display: flex; flex-direction: column; }

/* ═══ 封面页：渐变主视觉，匹配内容片 hero 暗色渐变风格 ═══ */
.bk-cover { align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary, var(--primary)) 100%); }
.bk-cover-band { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--accent), var(--chart-3, var(--accent)), var(--accent)); }
.bk-cover-logo { max-height: 110px; max-width: 300px; object-fit: contain; margin-bottom: 36px; position: relative; z-index: 1; }
.bk-cover-title { font-size: 58px; font-weight: 700; color: var(--background); letter-spacing: 0.06em; line-height: 1.3; max-width: 1080px; position: relative; z-index: 1; }
.bk-cover-subtitle { margin-top: 22px; font-size: 24px; color: var(--background); opacity: 0.8; letter-spacing: 0.2em; position: relative; z-index: 1; }
.bk-cover-rule { width: 140px; height: 3px; background: var(--accent); margin: 34px auto 0; position: relative; z-index: 1; }
.bk-cover-meta { margin-top: 40px; font-size: 19px; line-height: 1.9; color: var(--background); opacity: 0.75; position: relative; z-index: 1; }
.bk-cover-author { font-size: 23px; font-weight: 600; color: var(--background); }
/* 右下角旋转菱形装饰 */
.bk-cover::after { content: ''; position: absolute; bottom: 50px; right: 80px; width: 120px; height: 120px; border: 2px solid var(--accent); opacity: 0.15; transform: rotate(45deg); border-radius: 6px; }

/* ═══ 目录页：VI 规范 table 布局 + SVG 装饰 ═══ */
.bk-toc { padding: 80px 80px 60px; }
.bk-toc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.bk-toc-accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); z-index: 1; }
.bk-toc-heading { font-size: 40px; font-weight: 700; color: var(--primary); letter-spacing: -1px; margin-bottom: 12px; position: relative; z-index: 1; }
.bk-toc-heading::after { content: ''; display: block; width: 60px; height: 4px; margin: 8px 0 44px; background: var(--accent); border-radius: 2px; }
.bk-toc-table { width: 100%; border-collapse: collapse; font-size: 16px; position: relative; z-index: 1; }
.bk-toc-table td { padding: 12px 0; vertical-align: middle; }
.bk-toc-num { width: 48px; }
.bk-toc-num div { width: 32px; height: 32px; border-radius: 50%; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.bk-toc-title-cell { color: var(--text); border-bottom: 1px dotted rgba(var(--text-rgb), 0.15); font-weight: 600; }
.bk-toc-page { color: rgba(var(--text-rgb), 0.45); text-align: right; width: 40px; font-size: 13px; }
.bk-toc-footer { position: absolute; bottom: 40px; right: 60px; z-index: 1; display: flex; align-items: center; gap: 8px; }
.bk-toc-footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.bk-toc-footer-text { font-size: 14px; color: rgba(var(--text-rgb), 0.45); }

/* ═══ 章节隔页：渐变背景 + 大菱形水印 + 底部点缀线 ═══ */
.bk-chapter-divider { align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary, var(--primary)) 100%); }
/* 中央大菱形水印 */
.bk-chapter-divider::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 320px; height: 320px; border: 2px solid var(--accent); opacity: 0.07; border-radius: 8px; }
/* 底部 accent 短划线 */
.bk-chapter-divider::after { content: ''; position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 100px; height: 3px; background: var(--accent); opacity: 0.5; }
.bk-chapter-divider .bk-chapter-no { font-size: 22px; color: var(--chart-0, var(--accent)); letter-spacing: 0.35em; font-weight: 600; position: relative; z-index: 1; }
.bk-chapter-divider .bk-chapter-title { margin-top: 26px; font-size: 46px; font-weight: 700; color: var(--background); max-width: 1000px; line-height: 1.4; position: relative; z-index: 1; }
.bk-chapter-divider .bk-chapter-src { margin-top: 20px; font-size: 17px; color: var(--background); opacity: 0.6; position: relative; z-index: 1; }

/* ═══ 嵌入幻灯片（iframe 隔离，不同 PPT 源样式互不污染） ═══ */
.bk-embed-frame { border: none; width: 1280px; height: 720px; display: block; }

/* ═══ 文字内容页（custom/md 章节） ═══ */
.bk-prose-slide { padding: 60px 110px; }
.bk-prose { font-size: 20px; line-height: 1.9; overflow-y: auto; }
.bk-prose h1, .bk-prose h2, .bk-prose h3 { color: var(--primary); margin: 22px 0 12px; }
.bk-prose h1 { font-size: 32px; } .bk-prose h2 { font-size: 27px; } .bk-prose h3 { font-size: 23px; }
.bk-prose p { margin: 10px 0; }
.bk-prose ul, .bk-prose ol { margin: 10px 0 10px 26px; }
.bk-prose table { border-collapse: collapse; width: 100%; margin: 14px 0; }
.bk-prose th, .bk-prose td { border: 1px solid var(--text); padding: 8px 12px; }
.bk-prose th { background: var(--card-bg); color: var(--primary); }
.bk-prose blockquote { border-left: 4px solid var(--accent); background: var(--card-bg); padding: 12px 18px; margin: 14px 0; }

/* ═══ 封底页：镜面渐变 + 渐变点缀条 ═══ */
.bk-back { align-items: center; justify-content: center; text-align: center; background: linear-gradient(225deg, var(--primary) 0%, var(--secondary, var(--primary)) 100%); }
.bk-back::after { content: ''; position: absolute; top: 50px; right: 80px; width: 120px; height: 120px; border: 2px solid var(--accent); opacity: 0.12; transform: rotate(45deg); border-radius: 6px; }
.bk-back-band { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--accent), var(--primary), var(--accent)); }
.bk-back-text { font-size: 22px; line-height: 2.2; max-width: 900px; white-space: pre-wrap; color: var(--background); opacity: 0.85; position: relative; z-index: 1; }
.bk-back-brand { margin-top: 60px; font-size: 16px; color: var(--background); opacity: 0.55; line-height: 1.9; position: relative; z-index: 1; }

/* ═══ 控制条 ═══ */
.bk-nav {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; z-index: 10;
  background: rgba(0,0,0,0.55); color: #fff; padding: 8px 18px; border-radius: 20px;
  font-size: 14px; font-family: sans-serif; user-select: none;
}
.bk-nav button {
  background: none; border: 1px solid rgba(255,255,255,0.5); color: #fff;
  border-radius: 14px; padding: 3px 14px; cursor: pointer; font-size: 14px;
}
.bk-nav button:hover { background: rgba(255,255,255,0.2); }

/* ═══ 打印：横版每页一屏 ═══ */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { background: none; overflow: visible; height: auto; }
  .bk-stage { position: static; display: block; }
  .bk-slide {
    display: flex !important; flex-direction: column; position: relative;
    transform: none !important; page-break-after: always; break-after: page;
    margin: 0;
  }
  .bk-slide:last-of-type { page-break-after: auto; break-after: auto; }
  .bk-nav { display: none; }
}
</style>
</head>
<body>

<div class="bk-stage" id="bkStage">

  <!-- ═══ 封面 ═══ -->
  <section class="bk-slide bk-cover bk-active">
    <div class="bk-cover-band"></div>
    {{BOOK_LOGO}}
    <h1 class="bk-cover-title">{{BOOK_TITLE}}</h1>
    <div class="bk-cover-subtitle">{{BOOK_SUBTITLE}}</div>
    <div class="bk-cover-rule"></div>
    <div class="bk-cover-meta">
      <div class="bk-cover-author">{{BOOK_AUTHOR}}</div>
      <div>{{BOOK_ORG}} · {{BOOK_DATE}}</div>
      <div style="opacity:0.6;font-size:15px;margin-top:10px;">{{FLYLEAF_TEXT}}</div>
    </div>
  </section>

  <!-- ═══ 目录 ═══ -->
    <!-- ═══ 目录 ═══ -->
  <!--BK:TOC-->
  <section class="bk-slide bk-toc">
    <svg class="bk-toc-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="bkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(var(--text-rgb),0.03)" stroke-width="0.5"/>
        </pattern>
        <radialGradient id="bkGlow" cx="85%" cy="20%" r="45%">
          <stop offset="0%" stop-color="rgba(var(--primary-rgb),0.06)"/>
          <stop offset="100%" stop-color="rgba(var(--primary-rgb),0)"/>
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#bkGrid)"/>
      <circle cx="1080" cy="150" r="260" fill="url(#bkGlow)"/>
      <circle cx="1120" cy="580" r="90" fill="none" stroke="rgba(var(--primary-rgb),0.06)" stroke-width="1.5"/>
    </svg>
    <div class="bk-toc-accent-bar"></div>
    <h2 class="bk-toc-heading">目 录</h2>
    <table class="bk-toc-table">
      {{TOC_ENTRIES}}
    </table>
    <div class="bk-toc-footer">
      <div class="bk-toc-footer-dot"></div>
      <span class="bk-toc-footer-text">{{PAGE_TOTAL}} 章</span>
    </div>
  </section>
  <!--/BK:TOC-->

  <!-- ═══ 章节内容（隔页 + 幻灯片序列） ═══ -->
  {{CHAPTERS}}

  <!-- ═══ 封底 ═══ -->
  <!--BK:BACK-->
  <section class="bk-slide bk-back">
    <div class="bk-back-text">{{BACK_COVER_TEXT}}</div>
    <div class="bk-back-brand">{{BOOK_AUTHOR}} · {{BOOK_ORG}}<br>{{BRAND_COPYRIGHT}} {{BRAND_SIGNATURE}}<br>全书共 {{PAGE_TOTAL}} 章</div>
    <div class="bk-back-band"></div>
  </section>
  <!--/BK:BACK-->

</div>

<div class="bk-nav">
  <button id="bkPrev" type="button">← 上一页</button>
  <span id="bkCounter">1 / 1</span>
  <button id="bkNext" type="button">下一页 →</button>
</div>

<script>
/* ═══ 长正文自动拆页（模板内置资产）：超出固定页高的 .bk-prose 按块级子元素填充分页，表格按行拆，续页不带锚点 ═══ */
window.__BK_RDY = 0;
(function () {
  function contentBottom(box) {
    var r = box.getBoundingClientRect();
    var pb = parseFloat(getComputedStyle(box).paddingBottom) || 0;
    return r.bottom - pb;
  }
  function overflowIndex(prose, limit) {
    var kids = prose.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].getBoundingClientRect().bottom > limit + 1) return i;
    }
    return -1;
  }
  function splitTable(table, limit) {
    var rows = [];
    for (var b = 0; b < table.tBodies.length; b++) {
      rows = rows.concat(Array.prototype.slice.call(table.tBodies[b].rows));
    }
    var cut = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getBoundingClientRect().bottom > limit + 1) { cut = i; break; }
    }
    if (cut <= 0) return null; /* 首行就超 → 整表移到下一页 */
    var clone = table.cloneNode(false);
    if (table.tHead) clone.appendChild(table.tHead.cloneNode(true));
    var tb = document.createElement('tbody');
    for (var j = cut; j < rows.length; j++) tb.appendChild(rows[j]);
    clone.appendChild(tb);
    return clone;
  }
  window.bkSplitProse = function (opts) {
    Array.prototype.slice.call(opts.sections).forEach(function (section) {
      var cur = section, guard = 0;
      while (cur && guard++ < 200) {
        if (opts.prepare) opts.prepare(cur);
        var prose = cur.querySelector('.bk-prose');
        if (!prose) { if (opts.restore) opts.restore(cur); break; }
        var limit = contentBottom(opts.box ? opts.box(cur) : cur);
        var idx = overflowIndex(prose, limit);
        if (idx < 0) { if (opts.restore) opts.restore(cur); break; }
        var carry = [];
        var breaker = prose.children[idx];
        if (breaker && breaker.tagName === 'TABLE') {
          var rest = splitTable(breaker, limit);
          if (rest) { carry.push(rest); idx += 1; }
        }
        if (idx === 0 && carry.length === 0 && !cur.querySelector('.bk-chapter-head')) {
          if (prose.children.length <= 1) { if (opts.restore) opts.restore(cur); break; }
          idx = 1; /* 单个超高不可拆块留本页，其余移下页 */
        }
        var moved = [];
        while (prose.children.length > idx) moved.push(prose.removeChild(prose.children[idx]));
        var next = opts.makeCont(cur);
        carry.forEach(function (n) { next.prose.appendChild(n); });
        moved.forEach(function (n) { next.prose.appendChild(n); });
        if (opts.restore) opts.restore(cur);
        cur = next.section;
      }
    });
  };
})();

(function defer() {
  if (window.__BK_RDY !== 0) return;
  if (!document.documentElement.clientHeight || !document.documentElement.clientWidth)
    return requestAnimationFrame(defer);
  /* 翻页式下非激活片 display:none 无法测量 → 拆页时临时显隐（visibility:hidden 不闪屏） */
  window.bkSplitProse({
    sections: document.querySelectorAll('.bk-slide.bk-prose-slide'),
    prepare: function (s) { s.style.display = 'flex'; s.style.visibility = 'hidden'; },
    restore: function (s) { s.style.display = ''; s.style.visibility = ''; },
    makeCont: function (s) {
      var cont = s.cloneNode(false);
      cont.removeAttribute('id');
      cont.style.display = 'flex'; cont.style.visibility = 'hidden'; /* 供本轮继续测量，restore 时清除 */
      var prose = document.createElement('div'); prose.className = 'bk-prose';
      cont.appendChild(prose);
      s.parentNode.insertBefore(cont, s.nextSibling);
      return { section: cont, prose: prose };
    },
  });
  window.__BK_RDY = 1;
})();
</script>

<script>
/* ═══ R6 页面编排：拆页后应用正文逐页隐藏/排序（配置由装配引擎注入，仅锚点键与 int 列表） ═══ */
window.__BK_PROSE_ARRANGE = {{PROSE_ARRANGE}};
(function defer() {
  if (window.__BK_RDY > 1) return;
  if (window.__BK_RDY < 1) return requestAnimationFrame(defer);
  var cfg = window.__BK_PROSE_ARRANGE || {};
  Object.keys(cfg).forEach(function (anchor) {
    /* 本章拆页序列 = 原始正文页 + 续页（makeCont cloneNode 复制 data-bk-prose，DOM 序即页序） */
    var pages = Array.prototype.slice.call(document.querySelectorAll('[data-bk-prose="' + anchor + '"]'));
    if (!pages.length) return;
    var c = cfg[anchor] || {};
    var idxs = [], i;
    for (i = 0; i < pages.length; i++) idxs.push(i);
    var order = c.order;
    if (Object.prototype.toString.call(order) === '[object Array]' && order.length === pages.length) {
      var seen = {}, ok = true;
      for (i = 0; i < order.length; i++) {
        var v = order[i];
        if (typeof v !== 'number' || v < 0 || v >= pages.length || seen[v]) { ok = false; break; }
        seen[v] = 1;
      }
      if (ok) idxs = order; /* 非 0..n-1 完整排列 → 回退自然序（与后端 _visible_page_indices 同规则） */
    }
    var hidden = {};
    (c.hidden || []).forEach(function (v) { hidden[v] = 1; });
    var keep = [];
    for (i = 0; i < idxs.length; i++) { if (!hidden[idxs[i]]) keep.push(pages[idxs[i]]); }
    var parent = pages[0].parentNode;
    var tail = pages[pages.length - 1].nextSibling;
    pages.forEach(function (p) { parent.removeChild(p); });
    keep.forEach(function (p) { parent.insertBefore(p, tail); });
    /* 锚点跟随第一张保留页，目录跳转不失效 */
    if (keep.length && keep[0].id !== anchor) {
      pages.forEach(function (p) { if (p.id === anchor) p.removeAttribute('id'); });
      keep[0].id = anchor;
    }
  });
  window.__BK_RDY = 2;
})();
</script>

<script>
(function defer() {
  if (window.__BK_RDY > 2) return;
  if (window.__BK_RDY < 2) return requestAnimationFrame(defer);
  var slides = Array.prototype.slice.call(document.querySelectorAll('.bk-slide'));
  var idx = 0;
  var counter = document.getElementById('bkCounter');

  function fit() {
    var scale = Math.min(window.innerWidth / 1280, (window.innerHeight - 70) / 720);
    slides.forEach(function (s) { s.style.transform = 'scale(' + scale + ')'; });
  }

  function show(i) {
    if (i < 0) i = 0;
    if (i > slides.length - 1) i = slides.length - 1;
    idx = i;
    slides.forEach(function (s, k) { s.classList.toggle('bk-active', k === idx); });
    counter.textContent = (idx + 1) + ' / ' + slides.length;
  }

  document.getElementById('bkPrev').addEventListener('click', function () { show(idx - 1); });
  document.getElementById('bkNext').addEventListener('click', function () { show(idx + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(idx + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(idx - 1); e.preventDefault(); }
    if (e.key === 'Home') { show(0); }
    if (e.key === 'End') { show(slides.length - 1); }
  });

  // 目录点击跳转：tr[data-slide-target] → 对应章节隔页
  document.querySelectorAll('.bk-toc-table tr[data-slide-target]').forEach(function (tr) {
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', function () {
      var target = document.getElementById(tr.getAttribute('data-slide-target'));
      if (target) show(slides.indexOf(target));
    });
  });

  window.addEventListener('resize', fit);
  fit();
  show(0);
})();
</script>

</body>
</html>
