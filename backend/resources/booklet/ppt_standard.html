<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BOOK_TITLE}}</title>
<style>
/* ═══ 主题变量（全部经 THEME_CSS_VARS 注入，禁止写死实值） ═══ */
:root { {{THEME_CSS_VARS}} }

* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--book-desk); }
body {
  font-family: var(--book-font);
  color: var(--book-text);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  padding: 28px 0;
}

/* ═══ 标准页（PDF 型）：固定 16:9 页尺寸，一页接一页瀑布式排布 ═══ */
.bk-slide {
  width: 1280px; height: 720px; background: var(--book-bg);
  position: relative; display: flex; flex-direction: column;
  margin: 0 auto 28px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  overflow: hidden;
  transform-origin: top center;
}

/* ═══ 封面页 ═══ */
.bk-cover { align-items: center; justify-content: center; text-align: center; }
.bk-cover-band { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--book-accent); }
.bk-cover-logo { max-height: 110px; max-width: 300px; object-fit: contain; margin-bottom: 36px; }
.bk-cover-title { font-size: 58px; font-weight: 700; color: var(--book-primary); letter-spacing: 0.06em; line-height: 1.3; max-width: 1080px; }
.bk-cover-subtitle { margin-top: 22px; font-size: 24px; opacity: 0.75; letter-spacing: 0.2em; }
.bk-cover-rule { width: 140px; height: 3px; background: var(--book-accent); margin: 34px auto 0; }
.bk-cover-meta { margin-top: 40px; font-size: 19px; line-height: 1.9; }
.bk-cover-author { font-size: 23px; font-weight: 600; color: var(--book-primary); }

/* ═══ 目录页 ═══ */
.bk-toc { padding: 70px 120px; }
.bk-toc-title { font-size: 40px; font-weight: 700; color: var(--book-primary); letter-spacing: 0.3em; margin-bottom: 44px; }
.bk-toc-list { list-style: none; overflow-y: auto; }
.bk-toc-list li { margin-bottom: 20px; }
.bk-toc-list a { display: flex; align-items: baseline; text-decoration: none; color: var(--book-text); font-size: 22px; cursor: pointer; }
.bk-toc-num { flex-shrink: 0; width: 64px; font-weight: 700; color: var(--book-accent); font-variant-numeric: tabular-nums; }
.bk-toc-dots { flex: 1; margin: 0 14px; border-bottom: 2px dotted var(--book-text); opacity: 0.35; transform: translateY(-5px); }

/* ═══ 章节隔页 ═══ */
.bk-chapter-divider { align-items: center; justify-content: center; text-align: center; background: var(--book-primary); }
.bk-chapter-divider .bk-chapter-no { font-size: 22px; color: var(--book-accent); letter-spacing: 0.35em; font-weight: 600; }
.bk-chapter-divider .bk-chapter-title { margin-top: 26px; font-size: 46px; font-weight: 700; color: var(--book-bg); max-width: 1000px; line-height: 1.4; }
.bk-chapter-divider .bk-chapter-src { margin-top: 20px; font-size: 17px; color: var(--book-bg); opacity: 0.6; }

/* ═══ 嵌入幻灯片（iframe 隔离，不同 PPT 源样式互不污染） ═══ */
.bk-embed-frame { border: none; width: 1280px; height: 720px; display: block; }

/* ═══ 文字内容页（custom/md 章节）：固定页高，长文由拆页 JS 分片 ═══ */
.bk-prose-slide { padding: 60px 110px; }
.bk-prose { font-size: 20px; line-height: 1.9; }
.bk-prose h1, .bk-prose h2, .bk-prose h3 { color: var(--book-primary); margin: 22px 0 12px; }
.bk-prose h1 { font-size: 32px; } .bk-prose h2 { font-size: 27px; } .bk-prose h3 { font-size: 23px; }
.bk-prose p { margin: 10px 0; }
.bk-prose ul, .bk-prose ol { margin: 10px 0 10px 26px; }
.bk-prose table { border-collapse: collapse; width: 100%; margin: 14px 0; }
.bk-prose th, .bk-prose td { border: 1px solid var(--book-text); padding: 8px 12px; }
.bk-prose th { background: var(--book-card-bg); color: var(--book-primary); }
.bk-prose blockquote { border-left: 4px solid var(--book-accent); background: var(--book-card-bg); padding: 12px 18px; margin: 14px 0; }
.bk-prose img { max-width: 100%; }

/* ═══ 封底页 ═══ */
.bk-back { align-items: center; justify-content: center; text-align: center; }
.bk-back-band { position: absolute; bottom: 0; left: 0; right: 0; height: 10px; background: var(--book-primary); }
.bk-back-text { font-size: 22px; line-height: 2.2; max-width: 900px; white-space: pre-wrap; }
.bk-back-brand { margin-top: 60px; font-size: 16px; opacity: 0.6; line-height: 1.9; }

/* ═══ 打印：横版每页一屏 ═══ */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { background: none; padding: 0; }
  .bk-slide {
    transform: none !important; margin: 0 !important;
    box-shadow: none; page-break-after: always; break-after: page;
  }
  .bk-slide:last-of-type { page-break-after: auto; break-after: auto; }
}
</style>
</head>
<body>

<!-- ═══ 封面 ═══ -->
<section class="bk-slide bk-cover">
  <div class="bk-cover-band"></div>
  {{BOOK_LOGO}}
  <h1 class="bk-cover-title">{{BOOK_TITLE}}</h1>
  <div class="bk-cover-subtitle">{{BOOK_SUBTITLE}}</div>
  <div class="bk-cover-rule"></div>
  <div class="bk-cover-meta">
    <div class="bk-cover-author">{{BOOK_AUTHOR}}</div>
    <div>{{BOOK_ORG}} · {{BOOK_DATE}}</div>
    <div style="opacity:0.6;font-size:15px;margin-top:10px;">{{FLYLEAF_TEXT}}</div>
  </div>
</section>

<!-- ═══ 目录 ═══ -->
<!--BK:TOC-->
<section class="bk-slide bk-toc">
  <div class="bk-toc-title">目 录</div>
  <ul class="bk-toc-list">
    {{TOC_ENTRIES}}
  </ul>
</section>
<!--/BK:TOC-->

<!-- ═══ 章节内容（隔页 + 幻灯片序列，纵向连续） ═══ -->
{{CHAPTERS}}

<!-- ═══ 封底 ═══ -->
<!--BK:BACK-->
<section class="bk-slide bk-back">
  <div class="bk-back-text">{{BACK_COVER_TEXT}}</div>
  <div class="bk-back-brand">{{BOOK_AUTHOR}} · {{BOOK_ORG}}<br>{{BRAND_COPYRIGHT}} {{BRAND_SIGNATURE}}<br>全书共 {{PAGE_TOTAL}} 章</div>
  <div class="bk-back-band"></div>
</section>
<!--/BK:BACK-->

<script>
/* ═══ 长正文自动拆页（模板内置资产）：超出固定页高的 .bk-prose 按块级子元素填充分页，表格按行拆，续页不带锚点 ═══ */
(function () {
  function contentBottom(box) {
    var r = box.getBoundingClientRect();
    var pb = parseFloat(getComputedStyle(box).paddingBottom) || 0;
    return r.bottom - pb;
  }
  function overflowIndex(prose, limit) {
    var kids = prose.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].getBoundingClientRect().bottom > limit + 1) return i;
    }
    return -1;
  }
  function splitTable(table, limit) {
    var rows = [];
    for (var b = 0; b < table.tBodies.length; b++) {
      rows = rows.concat(Array.prototype.slice.call(table.tBodies[b].rows));
    }
    var cut = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getBoundingClientRect().bottom > limit + 1) { cut = i; break; }
    }
    if (cut <= 0) return null; /* 首行就超 → 整表移到下一页 */
    var clone = table.cloneNode(false);
    if (table.tHead) clone.appendChild(table.tHead.cloneNode(true));
    var tb = document.createElement('tbody');
    for (var j = cut; j < rows.length; j++) tb.appendChild(rows[j]);
    clone.appendChild(tb);
    return clone;
  }
  window.bkSplitProse = function (opts) {
    Array.prototype.slice.call(opts.sections).forEach(function (section) {
      var cur = section, guard = 0;
      while (cur && guard++ < 200) {
        if (opts.prepare) opts.prepare(cur);
        var prose = cur.querySelector('.bk-prose');
        if (!prose) { if (opts.restore) opts.restore(cur); break; }
        var limit = contentBottom(opts.box ? opts.box(cur) : cur);
        var idx = overflowIndex(prose, limit);
        if (idx < 0) { if (opts.restore) opts.restore(cur); break; }
        var carry = [];
        var breaker = prose.children[idx];
        if (breaker && breaker.tagName === 'TABLE') {
          var rest = splitTable(breaker, limit);
          if (rest) { carry.push(rest); idx += 1; }
        }
        if (idx === 0 && carry.length === 0 && !cur.querySelector('.bk-chapter-head')) {
          if (prose.children.length <= 1) { if (opts.restore) opts.restore(cur); break; }
          idx = 1; /* 单个超高不可拆块留本页，其余移下页 */
        }
        var moved = [];
        while (prose.children.length > idx) moved.push(prose.removeChild(prose.children[idx]));
        var next = opts.makeCont(cur);
        carry.forEach(function (n) { next.prose.appendChild(n); });
        moved.forEach(function (n) { next.prose.appendChild(n); });
        if (opts.restore) opts.restore(cur);
        cur = next.section;
      }
    });
  };
})();

(function () {
  window.bkSplitProse({
    sections: document.querySelectorAll('.bk-slide.bk-prose-slide'),
    makeCont: function (s) {
      var cont = s.cloneNode(false);
      cont.removeAttribute('id');
      var prose = document.createElement('div'); prose.className = 'bk-prose';
      cont.appendChild(prose);
      s.parentNode.insertBefore(cont, s.nextSibling);
      return { section: cont, prose: prose };
    },
  });
})();
</script>

<script>
(function () {
  // 窄屏适配：按可视宽度整体缩放页面，并补偿缩放后的空隙（在拆页之后采集）
  var slides = Array.prototype.slice.call(document.querySelectorAll('.bk-slide'));

  function fit() {
    var scale = Math.min(1, (window.innerWidth - 24) / 1280);
    slides.forEach(function (s) {
      if (scale >= 1) {
        s.style.transform = '';
        s.style.marginBottom = '';
        return;
      }
      s.style.transform = 'scale(' + scale + ')';
      var gap = s.offsetHeight * (1 - scale);
      s.style.marginBottom = (28 - gap) + 'px';
    });
  }

  // 目录点击滚动到对应章节隔页
  document.querySelectorAll('.bk-toc-list a[data-slide-target]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var target = document.getElementById(a.getAttribute('data-slide-target'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  window.addEventListener('resize', fit);
  fit();
})();
</script>

</body>
</html>
