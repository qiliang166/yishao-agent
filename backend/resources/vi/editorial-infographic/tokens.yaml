# 编辑信息图 — Editorial Infographic Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

color_scheme: editorial-cream

document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "27,40,56"
  white: "#ffffff"

color_schemes:
  editorial-cream:
    label: "编辑米白"
    primary: "#1b2838"
    secondary: "#4a6fa5"
    accent: "#e74c3c"
    background: "#f8f9fa"
    text: "#1b2838"
    card_bg: "#ffffff"
    chart_colors:
      - "#e74c3c"
      - "#3498db"
      - "#2ecc71"
      - "#f39c12"
      - "#9b59b6"
      - "#1abc9c"
      - "#e67e22"
      - "#34495e"
    semantic:
      positive: "#2ecc71"
      negative: "#e74c3c"
    persona_hint: "深蓝（#1b2838）+ 信号红（#e74c3c），经典财经杂志配色。DM Serif 衬线标题传递编辑权威，微圆角6px+淡阴影，红色仅占页面≤5%。"
  data-newsroom:
    label: "数据新闻"
    primary: "#1a1a2e"
    secondary: "#16213e"
    accent: "#e8630a"
    background: "#fafaf8"
    text: "#1a1a2e"
    card_bg: "#ffffff"
    chart_colors:
      - "#e8630a"
      - "#0f3460"
      - "#00a878"
      - "#f5c518"
      - "#7b2d8e"
      - "#00838f"
      - "#d32f2f"
      - "#455a64"
    semantic:
      positive: "#00a878"
      negative: "#d32f2f"
    persona_hint: "深炭蓝（#1a1a2e）+ 橙红强调（#e8630a），数据新闻编辑室风格。6px圆角+淡阴影，图表为视觉主角，橙色仅用于关键数据标记。"
  insight-magazine:
    label: "洞察周刊"
    primary: "#0d2137"
    secondary: "#1a3a5c"
    accent: "#0891b2"
    background: "#f7fafc"
    text: "#1a202c"
    card_bg: "#ffffff"
    chart_colors:
      - "#0891b2"
      - "#2563eb"
      - "#059669"
      - "#d97706"
      - "#7c3aed"
      - "#dc2626"
      - "#ea580c"
      - "#4b5563"
    semantic:
      positive: "#059669"
      negative: "#dc2626"
    persona_hint: "深海军蓝（#0d2137）+ 青蓝强调（#0891b2），商业洞察周刊。6px圆角+淡阴影，冷静专业的数据叙事风格。"
  trend-report:
    label: "趋势报告"
    primary: "#2d1b4e"
    secondary: "#4a2d7a"
    accent: "#f472b6"
    background: "#fdfafd"
    text: "#1a1035"
    card_bg: "#ffffff"
    chart_colors:
      - "#f472b6"
      - "#7c3aed"
      - "#10b981"
      - "#f59e0b"
      - "#3b82f6"
      - "#ef4444"
      - "#06b6d4"
      - "#64748b"
    semantic:
      positive: "#10b981"
      negative: "#ef4444"
    persona_hint: "深紫（#2d1b4e）+ 粉红强调（#f472b6），趋势预测报告。6px圆角+淡阴影，粉红仅用于趋势线和高亮标记，占比≤5%。"
  chronicle-stone:
    label: "编年史志"
    primary: "#292524"
    secondary: "#44403c"
    accent: "#b45309"
    background: "#faf9f6"
    text: "#292524"
    card_bg: "#ffffff"
    chart_colors:
      - "#b45309"
      - "#78716c"
      - "#0d9488"
      - "#ca8a04"
      - "#7c3aed"
      - "#dc2626"
      - "#2563eb"
      - "#475569"
    semantic:
      positive: "#0d9488"
      negative: "#dc2626"
    persona_hint: "暖石灰（#292524）+ 琥珀强调（#b45309），历史档案/编年史风格。6px圆角+淡阴影，沉稳克制的数据叙事。"

typography:
  heading_font: "DM Serif Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Source Sans 3, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cover_title:
    size: "52-60px"
    weight: 700
  page_title:
    size: "32-40px"
    weight: 700
  card_title:
    size: "18-22px"
    weight: 600
  body:
    size: "15-17px"
    weight: 400
  caption:
    size: "12-13px"
    weight: 400
  line_height:
    heading: 1.2-1.3
    body: 1.6-1.8
  letter_spacing:
    heading: "-0.3~-0.5px"

card_style:
  border_radius: 6
  shadow: "1px 4px 12px rgba(0,0,0,0.08)"
  border: "1px solid rgba({{text_rgb}}, 0.09)"
  gap: 24
  left_stripe_width: 3

gradients:
  hero_bg: "none"
  card_highlight: "none"

elevation:
  shadow_sm: "0 1px 3px rgba(0,0,0,0.04)"
  shadow_md: "1px 4px 12px rgba(0,0,0,0.08)"
  shadow_lg: "0 8px 30px rgba(0,0,0,0.12)"

slide_type_overrides:
  cover:
    card_bg: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{primary}}"
    text: "#ffffff"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{background}}"
    text: "{{primary}}"
    layout: full_bleed
  summary:
    background: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px solid rgba({{text_rgb}}, 0.12)"
    cell_border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.02-0.04"
    accent_stripe_height: 4

layout_types:
  - id: full_bleed
    cards: "1-3"
    description: "垂直居中，全屏"
    use: "封面、章节分隔、总结"
  - id: three_column
    cards: 3
    description: "水平等分，每栏 ~373px"
    use: "并列要点、三大优势"
  - id: two_column
    cards: 2
    description: "水平等分，每栏 ~550px"
    use: "对比分析、优劣对比"
  - id: two_column_asymmetric
    cards: 2
    description: "左宽 62% + 右窄 38%"
    use: "主次内容、问题+方案"
  - id: dashboard
    cards: "3-5"
    description: "顶行 metric 卡 + 底行 summary"
    use: "数据总览、KPI 展示"
  - id: mixed_grid
    cards: "3-4"
    description: "顶行 hero(全宽) + 底行 2-3 小卡"
    use: "核心观点+支撑论据"
  - id: hero_grid
    cards: "2-4"
    description: "左 hero 大卡 + 右 1-2 小卡堆叠"
    use: "论点+数据佐证"
  - id: single_focus
    cards: 1
    description: "居中大卡 ~900px"
    use: "核心结论、金句"
  - id: timeline
    cards: "2-5"
    description: "水平排列，步骤节点+连接线"
    use: "流程步骤、时间线"
  - id: horizontal_split
    cards: "3-4"
    description: "顶全宽 hero + 底行 2-3 小卡"
    use: "标题+支撑指标"

card_roles:
  - role: hero
    visual: "大卡，大面积，核心信息"
    required: [title, body]
    optional: [chart]
  - role: metric
    visual: "居中大数字/进度条，顶部短色条"
    required: [chart]
    optional: []
  - role: card_0
    visual: "标准卡，圆角 6px，左侧 3px 色条(chart_colors[0])"
    required: [title or body]
    optional: [chart]
  - role: card_1
    visual: "标准卡，圆角 6px，左侧 3px 色条(chart_colors[1])"
    required: [title or body]
    optional: [chart]
  - role: card_2
    visual: "标准卡，圆角 6px，左侧 3px 色条(chart_colors[2])"
    required: [title or body]
    optional: [chart]
  - role: card_3
    visual: "标准卡，圆角 6px，左侧 3px 色条(chart_colors[3])"
    required: [title or body]
    optional: [chart]
  - role: card_4
    visual: "标准卡，圆角 6px，左侧 3px 色条(chart_colors[4])"
    required: [title or body]
    optional: [chart]
  - role: left
    visual: "绿色顶条 + ▲ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比左/正面/优势"
  - role: right
    visual: "红色顶条 + ▼ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比右/反面/劣势"
  - role: summary
    visual: "全宽浅色卡"
    required: [title or body]
    optional: [chart]
    use: "数据总结、页面收尾"
  - role: step_N
    visual: "方形编号 + 标题 + 描述"
    required: [title, body]
    optional: []
    use: "时间线步骤 1~5"

decoration:
  accent_stripe: "3px solid {{accent}}"
  title_underline: "32×2px {{accent}}"
  page_dot: "4px {{primary}}"
  layers: ["背景层", "结构层", "内容层"]
  types:
    - id: type_a
      name: "编辑排版"
      description: "微圆角+淡阴影+细边框，数据图表为主角"
    - id: type_b
      name: "信息图表"
      description: "数据可视化优先，红色仅用于强调标记"

icons:
  style: "outline"
  stroke_width: "1.5px"
  card_size: 18
  hero_size: 32
  metric_size: 14
  color_rule: "跟随所在卡片的 chart_color, opacity: 0.7"

illustrations:
  label_align: "text-anchor=middle, label_x=graphic_cx"
  label_spacing: "≥22px from graphic bottom to label baseline"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "3 层结构完整"
  - "≥3 个 SVG 元素"
  - "≥4 种不同 chart_color"
  - "每卡: 标题 + 正文"
  - "数字→图表形态"
  - "标题 primary 色"
  - "正文 text 色"
  - "卡片 card_bg 色"
  - "背景 background 色"
  - "字体 typography token"
  - "圆角 6px"
  - "阴影 elevation token"
  - "封面/总结无卡片容器"
  - "色条轮换"
  - "红色占比≤5%"
  - "禁止大面积色块"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area:
  x_min: 40
  y_min: 28
  y_max: 710

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 1
  min_layers: 3

block_types:
  header:
    description: "文档头部（LOGO/编号/日期），全宽合并，可选段落"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.5)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.08)"
    columns: "2-4"
  title:
    description: "文档主标题，card_bg 背景 + accent 下划线，必有段落"
    colspan: full
    background: "{{card_bg}}"
    color: "{{primary}}"
    font_size: "20-24px"
    font_weight: 700
    letter_spacing: "1-2px"
    border_bottom: "2px solid {{accent}}"
  info_block:
    description: "键值对信息表，标签列 + 值列，可选图片占位区"
    colspan: auto
    label_bg: "rgba({{text_rgb}}, 0.04)"
    label_color: "{{primary}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba({{text_rgb}}, 0.15)"
    image_placeholder_radius: 4
  table_block:
    description: "多列数据网格，含表头和交替行数据"
    colspan: auto
    header_bg_default: "{{primary}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.08)"
    header_border_top: "2px solid rgba({{text_rgb}}, 0.1)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落文字，全宽合并"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  list_block:
    description: "编号或项目符号列表"
    colspan: full
    number_color: "{{primary}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  closing:
    description: "文档收束区域（结论/签名/落款），可选段落"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    layouts: ["center", "split"]
  footer:
    description: "文档底部声明区（版权/备注）"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    align: center
