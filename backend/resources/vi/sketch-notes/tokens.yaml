# 手绘笔记 — Sketch Notes Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

color_scheme: notebook-warm

document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "44,44,44"
  white: "#ffffff"

color_schemes:
  notebook-warm:
    label: "手帐暖纸"
    primary: "#2c2c2c"
    secondary: "#666666"
    accent: "#e63946"
    background: "#fdf8ef"
    text: "#2c2c2c"
    card_bg: "#fff8e7"
    chart_colors:
      - "#e63946"
      - "#457b9d"
      - "#2a9d8f"
      - "#e9c46a"
      - "#f4a261"
      - "#264653"
      - "#a8dadc"
      - "#6d6875"
    semantic:
      positive: "#2a9d8f"
      negative: "#e63946"
    persona_hint: "暖纸色底（#fdf8ef）+ 钢笔黑（#2c2c2c）+ 红色记号笔（#e63946）。2px实线边框，硬偏移阴影（3px 3px 0），手写字体模拟真实笔记本。"
  sketch-gray:
    label: "素描灰调"
    primary: "#2d2d2d"
    secondary: "#5a5a5a"
    accent: "#3b82f6"
    background: "#f2f1ee"
    text: "#2d2d2d"
    card_bg: "#faf8f5"
    chart_colors:
      - "#3b82f6"
      - "#6366f1"
      - "#10b981"
      - "#f59e0b"
      - "#ef4444"
      - "#8b5cf6"
      - "#06b6d4"
      - "#78716c"
    semantic:
      positive: "#10b981"
      negative: "#ef4444"
    persona_hint: "素描灰纸底（#f2f1ee）+ 铅笔黑（#2d2d2d）+ 蓝色记号（#3b82f6）。2px实线边框+硬阴影，建筑师/设计师手绘草图风。"
  journal-kraft:
    label: "日志牛皮"
    primary: "#3d2e1a"
    secondary: "#5a4428"
    accent: "#2a9d8f"
    background: "#f8f3e8"
    text: "#3d2e1a"
    card_bg: "#fdf5e6"
    chart_colors:
      - "#2a9d8f"
      - "#e76f51"
      - "#264653"
      - "#e9c46a"
      - "#f4a261"
      - "#457b9d"
      - "#a8dadc"
      - "#6d6875"
    semantic:
      positive: "#2a9d8f"
      negative: "#e76f51"
    persona_hint: "牛皮纸色底（#f8f3e8）+ 墨棕（#3d2e1a）+ 青绿记号（#2a9d8f）。2px实线边框+硬阴影，自然日志/野外考察笔记风。"
  doodle-white:
    label: "涂鸦白纸"
    primary: "#1a1a1a"
    secondary: "#4a4a4a"
    accent: "#a855f7"
    background: "#fefefe"
    text: "#1a1a1a"
    card_bg: "#fafafa"
    chart_colors:
      - "#a855f7"
      - "#3b82f6"
      - "#10b981"
      - "#f59e0b"
      - "#ef4444"
      - "#ec4899"
      - "#06b6d4"
      - "#78716c"
    semantic:
      positive: "#10b981"
      negative: "#ef4444"
    persona_hint: "白纸底（#fefefe）+ 墨水黑（#1a1a1a）+ 紫色记号（#a855f7）。2px实线边框+硬阴影，创意涂鸦/思维导图风。"
  memo-cream:
    label: "便签奶油"
    primary: "#1e293b"
    secondary: "#475569"
    accent: "#f59e0b"
    background: "#fffbeb"
    text: "#1e293b"
    card_bg: "#fef7e0"
    chart_colors:
      - "#f59e0b"
      - "#3b82f6"
      - "#10b981"
      - "#ef4444"
      - "#8b5cf6"
      - "#e63946"
      - "#06b6d4"
      - "#64748b"
    semantic:
      positive: "#10b981"
      negative: "#ef4444"
    persona_hint: "便签黄色底（#fffbeb）+ 深蓝墨水（#1e293b）+ 金色记号（#f59e0b）。2px实线边框+硬阴影，办公便签/会议笔记风。"

typography:
  heading_font: "Architects Daughter, Kalam, 'PingFang SC', 'Microsoft YaHei', cursive"
  body_font: "Kalam, 'PingFang SC', 'Microsoft YaHei', cursive"
  cover_title: { size: "48-56px", weight: 400 }
  page_title: { size: "32-40px", weight: 400 }
  card_title: { size: "18-22px", weight: 400 }
  body: { size: "16-18px", weight: 400 }
  caption: { size: "13-14px", weight: 400 }
  line_height: { heading: 1.3-1.5, body: 1.7-1.9 }
  letter_spacing: { heading: "0~0.5px" }

card_style:
  border_radius: 2
  shadow: "3px 3px 0 rgba(0,0,0,0.1)"
  border: "2px solid {{primary}}"
  gap: 24
  left_stripe_width: 3

gradients:
  hero_bg: "none"
  card_highlight: "none"

elevation:
  shadow_sm: "2px 2px 0 rgba(0,0,0,0.06)"
  shadow_md: "3px 3px 0 rgba(0,0,0,0.1)"
  shadow_lg: "5px 5px 0 rgba(0,0,0,0.12)"

slide_type_overrides:
  cover:
    card_bg: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{accent}}"
    text: "#ffffff"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{card_bg}}"
    text: "{{primary}}"
    layout: full_bleed
  summary:
    background: "{{card_bg}}"
    text: "{{primary}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "2px solid {{primary}}"
    cell_border: "1px solid rgba({{text_rgb}}, 0.12)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.03-0.05"
    accent_stripe_height: 4

layout_types:
  - { id: full_bleed, cards: "1-3", description: "垂直居中", use: "封面/章节/总结" }
  - { id: three_column, cards: 3, description: "水平等分", use: "并列要点" }
  - { id: two_column, cards: 2, description: "水平等分", use: "对比分析" }
  - { id: two_column_asymmetric, cards: 2, description: "左62%+右38%", use: "主次内容" }
  - { id: dashboard, cards: "3-5", description: "metric+summary", use: "数据总览" }
  - { id: mixed_grid, cards: "3-4", description: "hero+小卡", use: "核心观点" }
  - { id: hero_grid, cards: "2-4", description: "左hero+右小卡", use: "论点+数据" }
  - { id: single_focus, cards: 1, description: "居中大卡", use: "核心结论" }
  - { id: timeline, cards: "2-5", description: "水平步骤", use: "流程" }
  - { id: horizontal_split, cards: "3-4", description: "顶hero+底卡", use: "标题+指标" }

card_roles:
  - { role: hero, visual: "大卡，2px实线边框+硬偏移阴影", required: [title, body], optional: [chart] }
  - { role: metric, visual: "居中大数字，手写风格", required: [chart], optional: [] }
  - { role: card_0, visual: "标准卡，2px实线边框，红色记号", required: [title or body], optional: [chart] }
  - { role: card_1, visual: "标准卡，2px实线边框，蓝色记号", required: [title or body], optional: [chart] }
  - { role: card_2, visual: "标准卡，2px实线边框，绿色记号", required: [title or body], optional: [chart] }
  - { role: card_3, visual: "标准卡，2px实线边框，金色记号", required: [title or body], optional: [chart] }
  - { role: card_4, visual: "标准卡，2px实线边框，橙色记号", required: [title or body], optional: [chart] }
  - { role: left, visual: "绿色顶条+▲", required: [title,body], optional: [chart], use: "双栏左" }
  - { role: right, visual: "红色顶条+▼", required: [title,body], optional: [chart], use: "双栏右" }
  - { role: summary, visual: "全宽浅色卡", required: [title or body], optional: [chart], use: "总结" }
  - { role: step_N, visual: "手写圆形编号", required: [title,body], optional: [], use: "步骤" }

decoration:
  accent_stripe: "3px solid {{accent}}"
  title_underline: "32×3px {{accent}}"
  page_dot: "5px {{primary}}"
  layers: ["背景层", "纸张纹理层", "结构层", "内容层"]
  types:
    - { id: type_a, name: "笔记本", description: "2px实线边框+硬偏移阴影+手写字体+纸张纹理" }
    - { id: type_b, name: "记号笔", description: "红色记号强调+手绘图标+不完美线条" }

icons:
  style: "outline"
  stroke_width: "2px"
  card_size: 20
  hero_size: 36
  metric_size: 16
  color_rule: "跟随chart_color, opacity:0.85"

illustrations:
  label_align: "text-anchor=middle"
  label_spacing: "≥22px"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "4层结构完整"
  - "≥3个SVG元素"
  - "≥4种chart_color"
  - "每卡:标题+正文"
  - "数字→图表形态"
  - "标题primary色"
  - "正文text色"
  - "卡片card_bg色"
  - "背景background色"
  - "字体typography token"
  - "圆角2px"
  - "硬偏移阴影3px 3px 0"
  - "禁止光滑渐变"
  - "禁止精确阴影"
  - "保持手写感"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area: { x_min: 40, y_min: 28, y_max: 710 }

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 1
  min_layers: 4

block_types:
  header:
    description: "文档头部"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.5)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.1)"
    columns: "2-4"
  title:
    description: "文档主标题"
    colspan: full
    background: "{{card_bg}}"
    color: "{{primary}}"
    font_size: "20-24px"
    font_weight: 400
    letter_spacing: "0-1px"
    border_bottom: "2px solid {{accent}}"
  info_block:
    description: "键值对信息表"
    colspan: auto
    label_bg: "{{card_bg}}"
    label_color: "{{primary}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "2px dashed rgba({{text_rgb}}, 0.2)"
    image_placeholder_radius: 2
  table_block:
    description: "多列数据网格"
    colspan: auto
    header_bg_default: "{{primary}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.1)"
    header_border_top: "2px solid rgba({{text_rgb}}, 0.12)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  list_block:
    description: "列表"
    colspan: full
    number_color: "{{primary}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  closing:
    description: "收束区"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "2px solid {{primary}}"
    layouts: ["center", "split"]
  footer:
    description: "底部声明"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    align: center
