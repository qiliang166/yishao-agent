# 矢量插画 — Vector Illustration Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

color_scheme: flat-modern

document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "45,52,54"
  white: "#ffffff"

color_schemes:
  flat-modern:
    label: "扁平现代"
    primary: "#2d3436"
    secondary: "#636e72"
    accent: "#0984e3"
    background: "#f5f6fa"
    text: "#2d3436"
    card_bg: "#ffffff"
    chart_colors:
      - "#0984e3"
      - "#00b894"
      - "#fdcb6e"
      - "#e17055"
      - "#6c5ce7"
      - "#00cec9"
      - "#fab1a0"
      - "#55efc4"
    semantic:
      positive: "#00b894"
      negative: "#e17055"
    persona_hint: "炭黑色（#2d3436）+ 鲜艳蓝强调（#0984e3）+ 珊瑚/薄荷/紫辅助。圆角16px，图案透明度4%，扁平矢量美学。"
  pastel-pop:
    label: "粉彩流行"
    primary: "#3d3145"
    secondary: "#6d5d7a"
    accent: "#ff6b9d"
    background: "#faf8fc"
    text: "#3d3145"
    card_bg: "#ffffff"
    chart_colors:
      - "#ff6b9d"
      - "#48dbfb"
      - "#a29bfe"
      - "#feca57"
      - "#ff9ff3"
      - "#54a0ff"
      - "#5f27cd"
      - "#01a3a4"
    semantic:
      positive: "#01a3a4"
      negative: "#ff6b9d"
    persona_hint: "深紫灰（#3d3145）+ 糖果粉（#ff6b9d）+ 亮蓝/亮紫辅助。圆角16px，柔和扁平矢量，现代插画/UI插图风格。"
  bold-primary:
    label: "大胆原色"
    primary: "#1a1a2e"
    secondary: "#3d3d5c"
    accent: "#e63946"
    background: "#fafafa"
    text: "#1a1a2e"
    card_bg: "#ffffff"
    chart_colors:
      - "#e63946"
      - "#1d72b8"
      - "#f9c74f"
      - "#43aa8b"
      - "#f9844a"
      - "#577590"
      - "#90be6d"
      - "#f94144"
    semantic:
      positive: "#43aa8b"
      negative: "#e63946"
    persona_hint: "深蓝黑（#1a1a2e）+ 正红（#e63946）+ 蓝/黄/绿原色。圆角16px，强烈对比扁平设计，企业品牌/广告插图风。"
  warm-organic:
    label: "温暖有机"
    primary: "#3d2c1e"
    secondary: "#6b4d3a"
    accent: "#e07a5f"
    background: "#fdf8f4"
    text: "#3d2c1e"
    card_bg: "#ffffff"
    chart_colors:
      - "#e07a5f"
      - "#81b29a"
      - "#f2cc8f"
      - "#3d405b"
      - "#eab69f"
      - "#a3b18a"
      - "#d4a373"
      - "#588157"
    semantic:
      positive: "#81b29a"
      negative: "#e07a5f"
    persona_hint: "暖棕色（#3d2c1e）+ 赤陶橙（#e07a5f）+ 大地色系。圆角16px，温暖有机矢量造型，自然/有机品牌插画风。"
  cool-geometric:
    label: "冷静几何"
    primary: "#1a2332"
    secondary: "#2d3a4a"
    accent: "#5c6bc0"
    background: "#f4f6fb"
    text: "#1a2332"
    card_bg: "#ffffff"
    chart_colors:
      - "#5c6bc0"
      - "#26a69a"
      - "#ff7043"
      - "#fdd835"
      - "#ec407a"
      - "#42a5f5"
      - "#7e57c2"
      - "#78909c"
    semantic:
      positive: "#26a69a"
      negative: "#ec407a"
    persona_hint: "深灰蓝（#1a2332）+ 靛蓝紫（#5c6bc0）+ 冷色几何系。圆角16px，精确几何矢量，科技/数据可视化插图风。"

typography:
  heading_font: "Poppins, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  body_font: "Nunito, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cover_title: { size: "52-60px", weight: 700 }
  page_title: { size: "32-40px", weight: 700 }
  card_title: { size: "18-22px", weight: 600 }
  body: { size: "15-17px", weight: 400 }
  caption: { size: "12-13px", weight: 400 }
  line_height: { heading: 1.2-1.3, body: 1.6-1.8 }
  letter_spacing: { heading: "-0.3~-0.5px" }

card_style:
  border_radius: 16
  shadow: "0 4px 12px rgba(0,0,0,0.08)"
  border: "1px solid rgba({{text_rgb}}, 0.06)"
  gap: 24
  left_stripe_width: 4

gradients:
  hero_bg: "linear-gradient(135deg, {{primary}} 0%, {{secondary}} 100%)"
  card_highlight: "linear-gradient(180deg, {{card_bg}} 0%, rgba({{primary_rgb}}, 0.03) 100%)"

elevation:
  shadow_sm: "0 2px 4px rgba(0,0,0,0.04)"
  shadow_md: "0 4px 12px rgba(0,0,0,0.08)"
  shadow_lg: "0 12px 32px rgba(0,0,0,0.12)"

slide_type_overrides:
  cover:
    card_bg: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{accent}}"
    text: "#ffffff"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{background}}"
    text: "{{primary}}"
    layout: full_bleed
  summary:
    background: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px solid rgba({{text_rgb}}, 0.12)"
    cell_border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.04-0.06"
    accent_stripe_height: 5

layout_types:
  - { id: full_bleed, cards: "1-3", description: "垂直居中", use: "封面/章节/总结" }
  - { id: three_column, cards: 3, description: "水平等分", use: "并列要点" }
  - { id: two_column, cards: 2, description: "水平等分", use: "对比分析" }
  - { id: two_column_asymmetric, cards: 2, description: "左62%+右38%", use: "主次内容" }
  - { id: dashboard, cards: "3-5", description: "metric+summary", use: "数据总览" }
  - { id: mixed_grid, cards: "3-4", description: "hero+小卡", use: "核心观点" }
  - { id: hero_grid, cards: "2-4", description: "左hero+右小卡", use: "论点+数据" }
  - { id: single_focus, cards: 1, description: "居中大卡", use: "核心结论" }
  - { id: timeline, cards: "2-5", description: "水平步骤", use: "流程" }
  - { id: horizontal_split, cards: "3-4", description: "顶hero+底卡", use: "标题+指标" }

card_roles:
  - { role: hero, visual: "大卡，渐变背景", required: [title, body], optional: [chart] }
  - { role: metric, visual: "居中大数字，顶部短色条", required: [chart], optional: [] }
  - { role: card_0, visual: "标准卡，圆角16px，左侧4px色条", required: [title or body], optional: [chart] }
  - { role: card_1, visual: "标准卡，圆角16px，左侧4px色条", required: [title or body], optional: [chart] }
  - { role: card_2, visual: "标准卡，圆角16px，左侧4px色条", required: [title or body], optional: [chart] }
  - { role: card_3, visual: "标准卡，圆角16px，左侧4px色条", required: [title or body], optional: [chart] }
  - { role: card_4, visual: "标准卡，圆角16px，左侧4px色条", required: [title or body], optional: [chart] }
  - { role: left, visual: "绿色顶条+▲", required: [title,body], optional: [chart], use: "双栏左" }
  - { role: right, visual: "红色顶条+▼", required: [title,body], optional: [chart], use: "双栏右" }
  - { role: summary, visual: "全宽浅色卡", required: [title or body], optional: [chart], use: "总结" }
  - { role: step_N, visual: "圆形编号", required: [title,body], optional: [], use: "步骤" }

decoration:
  accent_stripe: "4px solid {{accent}}"
  title_underline: "40×3px {{accent}}"
  page_dot: "6px {{accent}}"
  layers: ["背景层", "图案纹理层", "结构层", "内容层"]
  types:
    - { id: type_a, name: "扁平矢量", description: "圆角16px+彩色阴影+几何图案纹理4%透明度" }
    - { id: type_b, name: "现代插画", description: "半透明几何图形+扁平图标+鲜艳色条" }

icons:
  style: "filled"
  stroke_width: "2px"
  card_size: 20
  hero_size: 36
  metric_size: 16
  color_rule: "跟随chart_color, opacity:0.9"

illustrations:
  label_align: "text-anchor=middle"
  label_spacing: "≥22px"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "4层结构完整"
  - "≥3个SVG元素"
  - "≥4种chart_color"
  - "≥1个几何图案装饰"
  - "每卡:标题+正文"
  - "数字→图表形态"
  - "标题primary色"
  - "正文text色"
  - "卡片card_bg色"
  - "背景background色"
  - "字体typography token"
  - "圆角16px"
  - "阴影elevation token"
  - "禁止锐角"
  - "禁止保守灰色调"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area: { x_min: 40, y_min: 28, y_max: 710 }

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 2
  min_layers: 4

block_types:
  header:
    description: "文档头部"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.5)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.08)"
    columns: "2-4"
  title:
    description: "文档主标题"
    colspan: full
    background: "linear-gradient(135deg, {{primary}} 0%, {{secondary}} 100%)"
    color: "#ffffff"
    font_size: "20-24px"
    font_weight: 700
    letter_spacing: "1-2px"
    border_bottom: "3px solid {{accent}}"
  info_block:
    description: "键值对信息表"
    colspan: auto
    label_bg: "{{card_bg}}"
    label_color: "{{accent}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba({{text_rgb}}, 0.15)"
    image_placeholder_radius: 8
  table_block:
    description: "多列数据网格"
    colspan: auto
    header_bg_default: "{{primary}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_border_top: "2px solid rgba({{text_rgb}}, 0.1)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  list_block:
    description: "列表"
    colspan: full
    number_color: "{{accent}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  closing:
    description: "收束区"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    layouts: ["center", "split"]
  footer:
    description: "底部声明"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    align: center
