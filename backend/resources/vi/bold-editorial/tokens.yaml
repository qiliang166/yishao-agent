# 大胆编辑 — Bold Editorial Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

# 当前激活的色系（兼容字段）
color_scheme: magazine-bw

# 文档模板映射 — 从 chart_colors 引用，避免破坏13色码结构
document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "17,17,17"
  white: "#ffffff"

color_schemes:
  magazine-bw:
    label: "杂志黑白"
    primary: "#000000"
    secondary: "#333333"
    accent: "#ff2d55"
    background: "#ffffff"
    text: "#111111"
    card_bg: "#f5f5f5"
    chart_colors:
      - "#ff2d55"
      - "#007aff"
      - "#ff9500"
      - "#34c759"
      - "#af52de"
      - "#5856d6"
      - "#ff3b30"
      - "#00c7be"
    semantic:
      positive: "#34c759"
      negative: "#ff2d55"
    persona_hint: "纯黑（#000000）+ 纯白（#ffffff）+ 鲜红强调（#ff2d55）。零圆角，3px 黑色实线边框，硬偏移阴影模拟杂志封面视觉冲击。"
  editorial-navy:
    label: "海军编辑"
    primary: "#0a1628"
    secondary: "#1e3a5f"
    accent: "#d4a853"
    background: "#fafaf9"
    text: "#111827"
    card_bg: "#f5f4f0"
    chart_colors:
      - "#d4a853"
      - "#0a1628"
      - "#c0392b"
      - "#2e7d32"
      - "#7b1fa2"
      - "#00838f"
      - "#e65100"
      - "#b8860b"
    semantic:
      positive: "#2e7d32"
      negative: "#c0392b"
    persona_hint: "深海军蓝（#0a1628）+ 金色点缀（#d4a853）。零圆角+黑边框+硬阴影，高级时装杂志内页质感。"
  press-crimson:
    label: "深红社论"
    primary: "#6b1111"
    secondary: "#8b1a1a"
    accent: "#1a1a1a"
    background: "#fefcf9"
    text: "#1a1414"
    card_bg: "#fdf6f3"
    chart_colors:
      - "#6b1111"
      - "#1a1a1a"
      - "#d97706"
      - "#0d7377"
      - "#7c3aed"
      - "#059669"
      - "#e11d48"
      - "#b45309"
    semantic:
      positive: "#059669"
      negative: "#6b1111"
    persona_hint: "深红（#6b1111）+ 炭黑点缀（#1a1a1a）。零圆角+黑边框+硬阴影，政治/文化评论杂志风格。"
  broadsheet-ink:
    label: "报纸油墨"
    primary: "#1a1a1a"
    secondary: "#4a4a4a"
    accent: "#0d7377"
    background: "#fdfaf3"
    text: "#1a1a1a"
    card_bg: "#faf6ee"
    chart_colors:
      - "#0d7377"
      - "#1a1a1a"
      - "#c27809"
      - "#3d7a3e"
      - "#8e24aa"
      - "#0277bd"
      - "#c62828"
      - "#6d4c41"
    semantic:
      positive: "#3d7a3e"
      negative: "#c62828"
    persona_hint: "炭黑油墨（#1a1a1a）+ 青蓝点缀（#0d7377）。暖纸底色+零圆角硬边框，传统报纸转型杂志。"
  mono-contrast:
    label: "极简对比"
    primary: "#0d0d0d"
    secondary: "#404040"
    accent: "#0066ff"
    background: "#ededed"
    text: "#0d0d0d"
    card_bg: "#f7f7f7"
    chart_colors:
      - "#0066ff"
      - "#0d0d0d"
      - "#ff6b35"
      - "#00b341"
      - "#9b59b6"
      - "#e74c3c"
      - "#1abc9c"
      - "#f39c12"
    semantic:
      positive: "#00b341"
      negative: "#e74c3c"
    persona_hint: "极黑（#0d0d0d）+ 电蓝点缀（#0066ff）+ 灰底。零圆角+硬阴影，现代设计杂志/建筑评论风格。"

typography:
  heading_font: "Playfair Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Source Sans 3, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cover_title:
    size: "62-72px"
    weight: 900
  page_title:
    size: "36-44px"
    weight: 700
  card_title:
    size: "20-24px"
    weight: 700
  body:
    size: "16-18px"
    weight: 400
  caption:
    size: "12-14px"
    weight: 400
  line_height:
    heading: 1.1-1.2
    body: 1.5-1.7
  letter_spacing:
    heading: "-0.5~-1px"

card_style:
  border_radius: 0
  shadow: "4px 4px 0 #000000"
  border: "3px solid #000000"
  gap: 20
  left_stripe_width: 4

gradients:
  hero_bg: "linear-gradient(180deg, #000000 0%, #1a1a1a 100%)"
  card_highlight: "linear-gradient(180deg, {{card_bg}} 0%, {{background}} 100%)"

elevation:
  shadow_sm: "none"
  shadow_md: "4px 4px 0 #000000"
  shadow_lg: "8px 8px 0 #000000"

slide_type_overrides:
  cover:
    card_bg: "#000000"
    text: "#ffffff"
    heading_scale: 1.5
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{accent}}"
    text: "#ffffff"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "#000000"
    text: "{{accent}}"
    layout: full_bleed
  summary:
    background: "#000000"
    text: "{{accent}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px solid rgba({{text_rgb}}, 0.15)"
    cell_border: "1px solid rgba({{text_rgb}}, 0.08)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.03-0.05"
    accent_stripe_height: 5

layout_types:
  - id: full_bleed
    cards: "1-3"
    description: "垂直居中，全屏"
    use: "封面、章节分隔、总结"
  - id: three_column
    cards: 3
    description: "水平等分，每栏 ~373px"
    use: "并列要点、三大优势"
  - id: two_column
    cards: 2
    description: "水平等分，每栏 ~550px"
    use: "对比分析、优劣对比"
  - id: two_column_asymmetric
    cards: 2
    description: "左宽 62% + 右窄 38%"
    use: "主次内容、问题+方案"
  - id: dashboard
    cards: "3-5"
    description: "顶行 metric 卡 + 底行 summary"
    use: "数据总览、KPI 展示"
  - id: mixed_grid
    cards: "3-4"
    description: "顶行 hero(全宽) + 底行 2-3 小卡"
    use: "核心观点+支撑论据"
  - id: hero_grid
    cards: "2-4"
    description: "左 hero 大卡 + 右 1-2 小卡堆叠"
    use: "论点+数据佐证"
  - id: single_focus
    cards: 1
    description: "居中大卡 ~900px"
    use: "核心结论、金句"
  - id: timeline
    cards: "2-5"
    description: "水平排列，步骤节点+连接线"
    use: "流程步骤、时间线"
  - id: horizontal_split
    cards: "3-4"
    description: "顶全宽 hero + 底行 2-3 小卡"
    use: "标题+支撑指标"

card_roles:
  - role: hero
    visual: "大卡，大面积，核心信息，hero_bg 渐变背景"
    required: [title, body]
    optional: [chart]
  - role: metric
    visual: "居中大数字/进度条，顶部粗色条"
    required: [chart]
    optional: []
  - role: card_0
    visual: "标准卡，直角，3px 黑边框，硬偏移阴影"
    required: [title or body]
    optional: [chart]
  - role: card_1
    visual: "标准卡，直角，3px 黑边框，硬偏移阴影"
    required: [title or body]
    optional: [chart]
  - role: card_2
    visual: "标准卡，直角，3px 黑边框，硬偏移阴影"
    required: [title or body]
    optional: [chart]
  - role: card_3
    visual: "标准卡，直角，3px 黑边框，硬偏移阴影"
    required: [title or body]
    optional: [chart]
  - role: card_4
    visual: "标准卡，直角，3px 黑边框，硬偏移阴影"
    required: [title or body]
    optional: [chart]
  - role: left
    visual: "绿色顶条 + ▲ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比左/正面/优势"
  - role: right
    visual: "红色顶条 + ▼ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比右/反面/劣势"
  - role: summary
    visual: "全宽浅色卡"
    required: [title or body]
    optional: [chart]
    use: "数据总结、页面收尾"
  - role: step_N
    visual: "大号圆形编号(28px) + 标题 + 描述"
    required: [title, body]
    optional: []
    use: "时间线步骤 1~5"

decoration:
  accent_stripe: "4px solid {{accent}}"
  title_underline: "40×3px #000000"
  page_dot: "6px #000000"
  layers: ["背景层", "结构层", "内容层"]
  types:
    - id: type_a
      name: "杂志封面"
      description: "粗黑边框 + 硬偏移阴影 + 大字重对比，零圆角"
    - id: type_b
      name: "编辑排版"
      description: "黑白主导 + 红色信号点缀 + 3px 实线边框"

icons:
  style: "filled"
  stroke_width: "2px"
  card_size: 22
  hero_size: 38
  metric_size: 16
  color_rule: "跟随所在卡片的 chart_color, opacity: 1.0"

illustrations:
  label_align: "text-anchor=middle, label_x=graphic_cx"
  label_spacing: "≥22px from graphic bottom to label baseline"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "3 层结构完整"
  - "≥3 个 SVG 元素"
  - "≥4 种不同 chart_color"
  - "每卡: SVG图标 + 标题 + 正文"
  - "数字→图表形态"
  - "顶部 accent 色条(4px)"
  - "页码(dot + 页号)"
  - "标题 primary 色"
  - "正文 text 色"
  - "卡片 card_bg 色"
  - "背景 background 色"
  - "字体 typography token"
  - "圆角 0px"
  - "阴影硬偏移 4px 4px 0"
  - "插图标签居中"
  - "插图间距 ≥22px"
  - "插图字号 ≥14px"
  - "SVG描边 ≥1px"
  - "封面/总结无卡片容器"
  - "色条轮换"
  - "禁止圆角"
  - "禁止柔和阴影"
  - "禁止中间色调"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area:
  x_min: 40
  y_min: 28
  y_max: 710

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 1
  min_layers: 3

block_types:
  header:
    description: "文档头部（LOGO/编号/日期），全宽合并，可选段落"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.55)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.1)"
    columns: "2-4"
  title:
    description: "文档主标题，hero 渐变背景 + accent 下划线，必有段落"
    colspan: full
    background: "linear-gradient(135deg, #000000 0%, #1a1a1a 100%)"
    color: "#ffffff"
    font_size: "20-24px"
    font_weight: 700
    letter_spacing: "1-2px"
    border_bottom: "3px solid {{accent}}"
  info_block:
    description: "键值对信息表，标签列 + 值列，可选图片占位区"
    colspan: auto
    label_bg: "{{card_bg}}"
    label_color: "#000000"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba({{text_rgb}}, 0.2)"
    image_placeholder_radius: 0
  table_block:
    description: "多列数据网格，含表头和交替行数据"
    colspan: auto
    header_bg_default: "#000000"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.12)"
    header_border_top: "2px solid rgba({{text_rgb}}, 0.15)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落文字，全宽合并"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.1)"
  list_block:
    description: "编号或项目符号列表"
    colspan: full
    number_color: "#000000"
    number_weight: 700
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.1)"
  closing:
    description: "文档收束区域（结论/签名/落款），可选段落"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "3px solid #000000"
    layouts: ["center", "split"]
  footer:
    description: "文档底部声明区（版权/备注）"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    align: center
