# 水彩晕染 — Watercolor Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

color_scheme: watercolor-dream

document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "55,71,79"
  white: "#ffffff"

color_schemes:
  watercolor-dream:
    label: "水彩梦境"
    primary: "#5c6bc0"
    secondary: "#7986cb"
    accent: "#ec407a"
    background: "#fafafa"
    text: "#37474f"
    card_bg: "#ffffff"
    chart_colors:
      - "#ec407a"
      - "#5c6bc0"
      - "#66bb6a"
      - "#ffa726"
      - "#ab47bc"
      - "#26c6da"
      - "#ef5350"
      - "#8d6e63"
    semantic:
      positive: "#66bb6a"
      negative: "#ec407a"
    persona_hint: "薰衣草蓝（#5c6bc0）+ 玫瑰红（#ec407a）+ 薄荷绿（#66bb6a）。大圆角24px，柔和彩色阴影，渐变色融合营造水彩晕染感。"
  bloom-garden:
    label: "花园绽放"
    primary: "#4a7c59"
    secondary: "#6fa87a"
    accent: "#e8a87c"
    background: "#fafdfa"
    text: "#3d4f3f"
    card_bg: "#ffffff"
    chart_colors:
      - "#e8a87c"
      - "#4a7c59"
      - "#d4a0c0"
      - "#f4c77a"
      - "#8fc0a9"
      - "#c47ea8"
      - "#f0b8a0"
      - "#a8c8b0"
    semantic:
      positive: "#4a7c59"
      negative: "#d4837a"
    persona_hint: "花园绿（#4a7c59）+ 蜜桃橙（#e8a87c）+ 花卉粉紫。大圆角24px，柔和彩色阴影，植物花卉水彩晕染。"
  sunset-wash:
    label: "晚霞晕染"
    primary: "#c05a4a"
    secondary: "#d4836a"
    accent: "#f4c77a"
    background: "#fdf9f7"
    text: "#4a3530"
    card_bg: "#ffffff"
    chart_colors:
      - "#f4c77a"
      - "#c05a4a"
      - "#d4a0c0"
      - "#a8c8d0"
      - "#e8b890"
      - "#c490a0"
      - "#a0b8c8"
      - "#d0c0a8"
    semantic:
      positive: "#7aac80"
      negative: "#c05a4a"
    persona_hint: "晚霞红（#c05a4a）+ 落日金（#f4c77a）+ 暖橙/淡紫。大圆角24px，柔和彩色阴影，夕阳水彩晕染感。"
  ocean-mist:
    label: "海雾朦胧"
    primary: "#4a8090"
    secondary: "#6aa0b0"
    accent: "#e0a070"
    background: "#f8fafb"
    text: "#3a4a50"
    card_bg: "#ffffff"
    chart_colors:
      - "#e0a070"
      - "#4a8090"
      - "#a0c8d0"
      - "#c0d4b0"
      - "#d4a0b0"
      - "#80b0c0"
      - "#b8c8a0"
      - "#c8a8b0"
    semantic:
      positive: "#6aaa80"
      negative: "#c4706a"
    persona_hint: "海蓝（#4a8090）+ 珊瑚橙（#e0a070）+ 海沫绿/淡蓝。大圆角24px，柔和彩色阴影，海岸水彩晕染。"
  autumn-leaf:
    label: "秋叶晕染"
    primary: "#8b5a3c"
    secondary: "#a8785a"
    accent: "#d4a040"
    background: "#fdfaf7"
    text: "#4a3830"
    card_bg: "#ffffff"
    chart_colors:
      - "#d4a040"
      - "#c06840"
      - "#8b5a3c"
      - "#a0c0a0"
      - "#e0b880"
      - "#c89070"
      - "#90b090"
      - "#c8a888"
    semantic:
      positive: "#6aa870"
      negative: "#c06040"
    persona_hint: "秋棕（#8b5a3c）+ 枫叶金（#d4a040）+ 落叶橙。大圆角24px，柔和彩色阴影，秋日水彩晕染感。"

typography:
  heading_font: "Cormorant Garamond, Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
  body_font: "Lato, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cover_title: { size: "52-60px", weight: 600 }
  page_title: { size: "32-40px", weight: 600 }
  card_title: { size: "18-22px", weight: 600 }
  body: { size: "15-17px", weight: 400 }
  caption: { size: "12-13px", weight: 400 }
  line_height: { heading: 1.2-1.4, body: 1.7-1.9 }
  letter_spacing: { heading: "0~0.5px" }

card_style:
  border_radius: 24
  shadow: "0 6px 20px rgba(92,107,192,0.12)"
  border: "1px solid rgba({{text_rgb}}, 0.05)"
  gap: 28
  left_stripe_width: 4

gradients:
  hero_bg: "linear-gradient(135deg, {{primary}} 0%, {{accent}} 100%)"
  card_highlight: "linear-gradient(180deg, {{card_bg}} 0%, rgba(92,107,192, 0.04) 100%)"

elevation:
  shadow_sm: "0 2px 8px rgba(92,107,192,0.06)"
  shadow_md: "0 6px 20px rgba(92,107,192,0.12)"
  shadow_lg: "0 12px 36px rgba(92,107,192,0.2)"

slide_type_overrides:
  cover:
    card_bg: "{{background}}"
    text: "{{primary}}"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{accent}}"
    text: "#ffffff"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{card_bg}}"
    text: "{{primary}}"
    layout: full_bleed
  summary:
    background: "{{card_bg}}"
    text: "{{primary}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px solid rgba({{text_rgb}}, 0.1)"
    cell_border: "1px solid rgba({{text_rgb}}, 0.05)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.03-0.05"
    accent_stripe_height: 5

layout_types:
  - { id: full_bleed, cards: "1-3", description: "垂直居中", use: "封面/章节/总结" }
  - { id: three_column, cards: 3, description: "水平等分", use: "并列要点" }
  - { id: two_column, cards: 2, description: "水平等分", use: "对比分析" }
  - { id: two_column_asymmetric, cards: 2, description: "左62%+右38%", use: "主次内容" }
  - { id: dashboard, cards: "3-5", description: "metric+summary", use: "数据总览" }
  - { id: mixed_grid, cards: "3-4", description: "hero+小卡", use: "核心观点" }
  - { id: hero_grid, cards: "2-4", description: "左hero+右小卡", use: "论点+数据" }
  - { id: single_focus, cards: 1, description: "居中大卡", use: "核心结论" }
  - { id: timeline, cards: "2-5", description: "水平步骤", use: "流程" }
  - { id: horizontal_split, cards: "3-4", description: "顶hero+底卡", use: "标题+指标" }

card_roles:
  - { role: hero, visual: "大卡，渐变背景+彩色阴影", required: [title, body], optional: [chart] }
  - { role: metric, visual: "居中大数字，柔和色彩", required: [chart], optional: [] }
  - { role: card_0, visual: "标准卡，圆角24px，柔和彩色阴影", required: [title or body], optional: [chart] }
  - { role: card_1, visual: "标准卡，圆角24px，柔和彩色阴影", required: [title or body], optional: [chart] }
  - { role: card_2, visual: "标准卡，圆角24px，柔和彩色阴影", required: [title or body], optional: [chart] }
  - { role: card_3, visual: "标准卡，圆角24px，柔和彩色阴影", required: [title or body], optional: [chart] }
  - { role: card_4, visual: "标准卡，圆角24px，柔和彩色阴影", required: [title or body], optional: [chart] }
  - { role: left, visual: "绿色顶条+▲", required: [title,body], optional: [chart], use: "双栏左" }
  - { role: right, visual: "红色顶条+▼", required: [title,body], optional: [chart], use: "双栏右" }
  - { role: summary, visual: "全宽浅色卡", required: [title or body], optional: [chart], use: "总结" }
  - { role: step_N, visual: "圆形彩色编号", required: [title,body], optional: [], use: "步骤" }

decoration:
  accent_stripe: "4px solid {{accent}}"
  title_underline: "40×2px {{accent}}"
  page_dot: "5px {{primary}}"
  layers: ["背景层", "水彩晕染纹理层", "结构层", "内容层", "柔光层"]
  types:
    - { id: type_a, name: "水彩晕染", description: "大圆角24px+彩色柔和阴影+渐变晕染+水彩纹理" }
    - { id: type_b, name: "梦幻花园", description: "柔和色彩融合+有机形状+半透明装饰" }

icons:
  style: "outline"
  stroke_width: "1.5px"
  card_size: 20
  hero_size: 36
  metric_size: 16
  color_rule: "跟随chart_color, opacity:0.8"

illustrations:
  label_align: "text-anchor=middle"
  label_spacing: "≥22px"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "5层结构完整"
  - "≥3个SVG元素"
  - "≥4种chart_color"
  - "≥1个水彩风格装饰"
  - "每卡:标题+正文"
  - "数字→图表形态"
  - "标题primary色"
  - "正文text色"
  - "卡片card_bg色"
  - "背景background色"
  - "字体typography token"
  - "圆角24px"
  - "柔和彩色阴影"
  - "禁止锐角"
  - "禁止粗重边框"
  - "禁止纯黑色"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area: { x_min: 40, y_min: 28, y_max: 710 }

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 2
  min_layers: 5

block_types:
  header:
    description: "文档头部"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.45)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.06)"
    columns: "2-4"
  title:
    description: "文档主标题"
    colspan: full
    background: "linear-gradient(135deg, {{primary}} 0%, {{accent}} 100%)"
    color: "#ffffff"
    font_size: "20-24px"
    font_weight: 600
    letter_spacing: "1-2px"
    border_bottom: "2px solid rgba(255,255,255,0.3)"
  info_block:
    description: "键值对信息表"
    colspan: auto
    label_bg: "rgba(92,107,192, 0.05)"
    label_color: "{{primary}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba(92,107,192, 0.2)"
    image_placeholder_radius: 12
  table_block:
    description: "多列数据网格"
    colspan: auto
    header_bg_default: "{{primary}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba(92,107,192, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_border_top: "2px solid rgba(92,107,192, 0.15)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.06)"
  list_block:
    description: "列表"
    colspan: full
    number_color: "{{primary}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.06)"
  closing:
    description: "收束区"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "1.5px solid rgba(92,107,192, 0.12)"
    layouts: ["center", "split"]
  footer:
    description: "底部声明"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba(92,107,192, 0.1)"
    align: center
