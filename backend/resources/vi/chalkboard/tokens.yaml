# 黑板教学 — Chalkboard Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

# 当前激活的色系（兼容字段）
color_scheme: green-chalkboard

# 文档模板映射 — 从 chart_colors 引用，避免破坏13色码结构
document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "232,224,208"
  white: "#ffffff"

color_schemes:
  green-chalkboard:
    label: "经典绿板"
    primary: "#2d4a3e"
    secondary: "#3d6b5a"
    accent: "#f5e6ab"
    background: "#1a3329"
    text: "#e8e0d0"
    card_bg: "#264539"
    chart_colors:
      - "#f5e6ab"
      - "#7ecfc0"
      - "#f0a0a0"
      - "#a0c4f0"
      - "#c4a0f0"
      - "#f0c4a0"
      - "#a0f0c4"
      - "#f0f0a0"
    semantic:
      positive: "#7ecfc0"
      negative: "#f0a0a0"
    persona_hint: "深绿黑板底色（#1a3329）+ 粉笔白文字（#e8e0d0）。2px虚线边框模拟粉笔画，彩色粉笔辅助色（黄/粉/蓝/紫），手写字体营造课堂板书感。"
  black-chalkboard:
    label: "经典黑板"
    primary: "#1a1d1a"
    secondary: "#2a2f2a"
    accent: "#f0eabc"
    background: "#0f1210"
    text: "#e6e0ce"
    card_bg: "#1c201c"
    chart_colors:
      - "#f0eabc"
      - "#8cd4c8"
      - "#f5a0a0"
      - "#a8ccf0"
      - "#cca8f0"
      - "#f0cca8"
      - "#a8f0cc"
      - "#f0f0a8"
    semantic:
      positive: "#8cd4c8"
      negative: "#f5a0a0"
    persona_hint: "纯黑教室黑板（#0f1210）+ 粉笔白文字（#e6e0ce）。2px虚线边框+粉笔色图表，传统课堂的经典配色。"
  slate-chalkboard:
    label: "石板灰板"
    primary: "#2a2d33"
    secondary: "#3d424a"
    accent: "#e8ddb5"
    background: "#1a1c21"
    text: "#dfdac8"
    card_bg: "#262930"
    chart_colors:
      - "#e8ddb5"
      - "#85bfb5"
      - "#f0a8a8"
      - "#a0bcf0"
      - "#c0a8f0"
      - "#f0c0a8"
      - "#a8f0c8"
      - "#f0eca8"
    semantic:
      positive: "#85bfb5"
      negative: "#f0a8a8"
    persona_hint: "石板灰色底板（#1a1c21）+ 暖白粉笔文字（#dfdac8）。2px虚线边框，现代教室的冷静灰调。"
  navy-chalkboard:
    label: "深蓝教板"
    primary: "#1c2840"
    secondary: "#2a3d5e"
    accent: "#e8ddb8"
    background: "#111827"
    text: "#dfd9c5"
    card_bg: "#1e2c45"
    chart_colors:
      - "#e8ddb8"
      - "#80c0b5"
      - "#f0a5a5"
      - "#a8c5f0"
      - "#c5a8f0"
      - "#f0c5a8"
      - "#a8f0c5"
      - "#f0f0a8"
    semantic:
      positive: "#80c0b5"
      negative: "#f0a5a5"
    persona_hint: "深蓝黑板底（#111827）+ 暖粉笔文字（#dfd9c5）。2px虚线边框，大学讲座厅的沉稳蓝调。"
  brown-chalkboard:
    label: "木纹教板"
    primary: "#2e2318"
    secondary: "#453420"
    accent: "#eed9a0"
    background: "#1a140d"
    text: "#e5d8c0"
    card_bg: "#2a2016"
    chart_colors:
      - "#eed9a0"
      - "#85c0b0"
      - "#f0a8a0"
      - "#a5bdf0"
      - "#c8a8f0"
      - "#f0c8a8"
      - "#a5f0c5"
      - "#f0eda8"
    semantic:
      positive: "#85c0b0"
      negative: "#f0a8a0"
    persona_hint: "深棕木纹底板（#1a140d）+ 奶白粉笔文字（#e5d8c0）。2px虚线边框+暖色调粉笔色，复古教室木制黑板的温润质感。"

typography:
  heading_font: "Caveat, 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', cursive"
  body_font: "Patrick Hand, 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', cursive"
  cover_title:
    size: "52-62px"
    weight: 700
  page_title:
    size: "32-40px"
    weight: 700
  card_title:
    size: "20-24px"
    weight: 600
  body:
    size: "16-18px"
    weight: 400
  caption:
    size: "13-14px"
    weight: 400
  line_height:
    heading: 1.2-1.4
    body: 1.7-1.9
  letter_spacing:
    heading: "0.5~1px"

card_style:
  border_radius: 2
  shadow: "none"
  border: "2px dashed rgba(232,224,208,0.3)"
  gap: 24
  left_stripe_width: 4

gradients:
  hero_bg: "linear-gradient(180deg, {{background}} 0%, {{card_bg}} 100%)"
  card_highlight: "linear-gradient(180deg, {{card_bg}} 0%, {{background}} 100%)"

elevation:
  shadow_sm: "none"
  shadow_md: "none"
  shadow_lg: "0 0 20px rgba(0,0,0,0.3)"

slide_type_overrides:
  cover:
    card_bg: "{{background}}"
    text: "{{accent}}"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{card_bg}}"
    text: "{{accent}}"
    body_font_style: italic
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{primary}}"
    text: "{{accent}}"
    layout: full_bleed
  summary:
    background: "{{primary}}"
    text: "{{accent}}"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px dashed rgba({{text_rgb}}, 0.15)"
    cell_border: "1px dashed rgba({{text_rgb}}, 0.08)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.05-0.08"
    accent_stripe_height: 5

layout_types:
  - id: full_bleed
    cards: "1-3"
    description: "垂直居中，全屏"
    use: "封面、章节分隔、总结"
  - id: three_column
    cards: 3
    description: "水平等分，每栏 ~373px"
    use: "并列要点、三大优势"
  - id: two_column
    cards: 2
    description: "水平等分，每栏 ~550px"
    use: "对比分析、优劣对比"
  - id: two_column_asymmetric
    cards: 2
    description: "左宽 62% + 右窄 38%"
    use: "主次内容、问题+方案"
  - id: dashboard
    cards: "3-5"
    description: "顶行 metric 卡 + 底行 summary"
    use: "数据总览、KPI 展示"
  - id: mixed_grid
    cards: "3-4"
    description: "顶行 hero(全宽) + 底行 2-3 小卡"
    use: "核心观点+支撑论据"
  - id: hero_grid
    cards: "2-4"
    description: "左 hero 大卡 + 右 1-2 小卡堆叠"
    use: "论点+数据佐证"
  - id: single_focus
    cards: 1
    description: "居中大卡 ~900px"
    use: "核心结论、金句"
  - id: timeline
    cards: "2-5"
    description: "水平排列，步骤节点+连接线"
    use: "流程步骤、时间线"
  - id: horizontal_split
    cards: "3-4"
    description: "顶全宽 hero + 底行 2-3 小卡"
    use: "标题+支撑指标"

card_roles:
  - role: hero
    visual: "大卡，大面积，核心信息，hero_bg 渐变背景"
    required: [title, body]
    optional: [chart]
  - role: metric
    visual: "居中大数字/进度条，顶部短色条"
    required: [chart]
    optional: []
  - role: card_0
    visual: "标准卡，圆角 2px，虚线边框，粉笔色条(chart_colors[0])"
    required: [title or body]
    optional: [chart]
  - role: card_1
    visual: "标准卡，圆角 2px，虚线边框，粉笔色条(chart_colors[1])"
    required: [title or body]
    optional: [chart]
  - role: card_2
    visual: "标准卡，圆角 2px，虚线边框，粉笔色条(chart_colors[2])"
    required: [title or body]
    optional: [chart]
  - role: card_3
    visual: "标准卡，圆角 2px，虚线边框，粉笔色条(chart_colors[3])"
    required: [title or body]
    optional: [chart]
  - role: card_4
    visual: "标准卡，圆角 2px，虚线边框，粉笔色条(chart_colors[4])"
    required: [title or body]
    optional: [chart]
  - role: left
    visual: "绿色顶条 + ▲ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比左/正面/优势"
  - role: right
    visual: "红色顶条 + ▼ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比右/反面/劣势"
  - role: summary
    visual: "全宽半透明卡"
    required: [title or body]
    optional: [chart]
    use: "数据总结、页面收尾"
  - role: step_N
    visual: "圆形虚线编号 + 标题 + 描述"
    required: [title, body]
    optional: []
    use: "时间线步骤 1~5"

decoration:
  accent_stripe: "4px dashed {{accent}}"
  title_underline: "40×2px {{accent}}"
  page_dot: "6px {{accent}}"
  layers: ["背景层", "粉笔灰纹理层", "结构层", "内容层"]
  types:
    - id: type_a
      name: "黑板板书"
      description: "虚线边框 + 粉笔色文字 + 手写字体 + 粉笔灰纹理"
    - id: type_b
      name: "粉笔手绘"
      description: "虚线元素 + 粉笔色图表 + 圆形虚线编号"

icons:
  style: "outline"
  stroke_width: "2px"
  card_size: 20
  hero_size: 36
  metric_size: 16
  color_rule: "跟随所在卡片的 chart_color, opacity: 0.85"

illustrations:
  label_align: "text-anchor=middle, label_x=graphic_cx"
  label_spacing: "≥22px from graphic bottom to label baseline"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "4 层结构完整"
  - "≥3 个 SVG 元素"
  - "≥4 种不同 chart_color"
  - "≥1 个虚线装饰"
  - "每卡: SVG图标 + 标题 + 正文"
  - "数字→图表形态"
  - "顶部 accent 虚线色条(4px)"
  - "标题短线(40×2px)"
  - "页码(dot + 页号)"
  - "标题 primary 色"
  - "正文 text 色"
  - "卡片 card_bg 色"
  - "背景 background 色"
  - "字体 typography token"
  - "圆角 2px"
  - "无阴影（黑板不投影）"
  - "插图标签居中"
  - "插图间距 ≥22px"
  - "插图字号 ≥14px"
  - "SVG描边 ≥1px"
  - "封面/总结无卡片容器"
  - "色条轮换"
  - "禁止光滑渐变"
  - "禁止精确阴影"
  - "禁止饱和鲜艳色"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area:
  x_min: 40
  y_min: 28
  y_max: 710

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 2
  min_layers: 4

block_types:
  header:
    description: "文档头部（LOGO/编号/日期），全宽合并，可选段落"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.5)"
    border_bottom: "1px dashed rgba({{text_rgb}}, 0.12)"
    columns: "2-4"
  title:
    description: "文档主标题，hero 渐变背景 + accent 下划线，必有段落"
    colspan: full
    background: "linear-gradient(135deg, {{primary}} 0%, {{secondary}} 100%)"
    color: "{{accent}}"
    font_size: "20-24px"
    font_weight: 700
    letter_spacing: "1-2px"
    border_bottom: "2px dashed {{accent}}"
  info_block:
    description: "键值对信息表，标签列 + 值列，可选图片占位区"
    colspan: auto
    label_bg: "{{card_bg}}"
    label_color: "{{accent}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba({{text_rgb}}, 0.2)"
    image_placeholder_radius: 2
  table_block:
    description: "多列数据网格，含表头和交替行数据"
    colspan: auto
    header_bg_default: "{{primary}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "{{accent}}"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.03)"
    data_font_size: "12px"
    row_height: 26
    border: "1px dashed rgba({{text_rgb}}, 0.1)"
    header_border_top: "2px dashed rgba({{text_rgb}}, 0.15)"
    header_rotation: "primary → chart_0 → chart_2"
  text_block:
    description: "自由段落文字，全宽合并"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px dashed rgba({{text_rgb}}, 0.1)"
  list_block:
    description: "编号或项目符号列表"
    colspan: full
    number_color: "{{accent}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px dashed rgba({{text_rgb}}, 0.1)"
  closing:
    description: "文档收束区域（结论/签名/落款），可选段落"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "1.5px dashed rgba({{text_rgb}}, 0.12)"
    layouts: ["center", "split"]
  footer:
    description: "文档底部声明区（版权/备注）"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px dashed rgba({{text_rgb}}, 0.12)"
    align: center
