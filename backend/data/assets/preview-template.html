<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root {
  --accent: {{ACCENT_COLOR}};
  --bg: #0b0b1a;
  --card-bg: #12122e;
  --text: #ccc;
  --text-dim: #777;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);padding:20px;
}
.header{
  text-align:center;padding:30px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:16px;
}
.header h1{font-size:22px;color:#fff}
.header .sub{font-size:12px;opacity:0.35;margin-top:4px}
.logo-badge{
  display:inline-block;padding:2px 10px;border-radius:4px;
  font-size:10px;font-weight:700;background:var(--accent);color:#fff;margin-left:8px;
}

.mode-bar{
  display:flex;justify-content:center;gap:8px;margin:18px 0 24px;
}
.mode-bar button{
  padding:8px 20px;border:1px solid rgba(255,255,255,0.12);
  background:transparent;color:var(--text-dim);border-radius:6px;
  cursor:pointer;font-size:13px;font-family:inherit;
  transition:all 0.15s;
}
.mode-bar button:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.mode-bar button.active{
  background:var(--accent);border-color:var(--accent);color:#fff;
}

/* ── Gallery ── */
#gallery{max-width:1200px;margin:0 auto}
.slide-card{
  background:var(--card-bg);border-radius:12px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.45);margin-bottom:14px;
}
.slide-label{
  padding:9px 18px;background:rgba(255,255,255,0.025);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.slide-label .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.slide-card img,.slide-card object{width:100%;height:auto;display:block}

/* ── Scroll ── */
#scroll-view{display:none;max-width:1200px;margin:0 auto}
#scroll-view .slide-card{margin-bottom:40px}

/* ── Present ── */
#present-view{display:none;max-width:1200px;margin:0 auto;text-align:center}
#present-view .slide-card{margin-bottom:0}
.present-nav{
  display:flex;align-items:center;justify-content:center;gap:20px;margin-top:16px;
}
.present-nav button{
  padding:8px 24px;border:1px solid rgba(255,255,255,0.15);
  background:transparent;color:var(--text-dim);border-radius:6px;
  cursor:pointer;font-size:13px;font-family:inherit;
  transition:all 0.15s;
}
.present-nav button:hover{color:#fff;border-color:var(--accent)}
.present-nav .counter{font-size:14px;color:var(--text-dim);min-width:80px}
#present-slide{display:flex;justify-content:center}

/* ── Empty state ── */
.empty-state{
  text-align:center;padding:80px 20px;color:var(--text-dim);
}
.empty-state p{font-size:15px}
</style>
</head>
<body>

<div class="header">
  <h1>{{TITLE}}<span class="logo-badge">{{LOGO}}</span></h1>
  <div class="sub">SVG 幻灯片预览 &middot; 1280×720</div>
</div>

<div class="mode-bar">
  <button id="btn-gallery" class="active" onclick="switchMode('gallery')">Gallery</button>
  <button id="btn-scroll" onclick="switchMode('scroll')">Scroll</button>
  <button id="btn-present" onclick="switchMode('present')">Present</button>
</div>

<div id="gallery"></div>
<div id="scroll-view"></div>
<div id="present-view">
  <div id="present-slide"></div>
  <div class="present-nav">
    <button onclick="prevSlide()">&larr; Prev</button>
    <span class="counter" id="slide-counter"></span>
    <button onclick="nextSlide()">Next &rarr;</button>
  </div>
</div>

<script>
var slides = {{SLIDES_JSON}};
var currentMode = 'gallery';
var currentSlide = 0;

var dotColors = ['#e67e22','#2d5f8a','#c0392b','#27ae60','#8e44ad','#2980b9','#d35400','#16a085'];

function buildSlideCard(s, idx) {
  var color = dotColors[idx % dotColors.length];
  return '<div class="slide-card">' +
    '<div class="slide-label">' +
      '<span class="dot" style="background:' + color + '"></span> ' +
      'Slide ' + (idx + 1) + ' &mdash; ' + escHtml(s.label) +
    '</div>' +
    '<img src="' + escAttr(s.file) + '" alt="' + escAttr(s.label) + '" loading="lazy">' +
  '</div>';
}

function renderGallery() {
  var el = document.getElementById('gallery');
  if (!slides.length) {
    el.innerHTML = '<div class="empty-state"><p>No slides to display</p></div>';
    return;
  }
  el.innerHTML = slides.map(buildSlideCard).join('');
}

function renderScroll() {
  var el = document.getElementById('scroll-view');
  el.innerHTML = slides.map(buildSlideCard).join('');
}

function renderPresentSlide() {
  var el = document.getElementById('present-slide');
  var counter = document.getElementById('slide-counter');
  if (!slides.length) {
    el.innerHTML = '<div class="empty-state"><p>No slides</p></div>';
    counter.textContent = '';
    return;
  }
  el.innerHTML = buildSlideCard(slides[currentSlide], currentSlide);
  counter.textContent = (currentSlide + 1) + ' / ' + slides.length;
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('gallery').style.display = mode === 'gallery' ? 'block' : 'none';
  document.getElementById('scroll-view').style.display = mode === 'scroll' ? 'block' : 'none';
  document.getElementById('present-view').style.display = mode === 'present' ? 'block' : 'none';
  ['btn-gallery','btn-scroll','btn-present'].forEach(function(id){
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('btn-' + mode).classList.add('active');

  if (mode === 'gallery' && !document.getElementById('gallery').innerHTML) renderGallery();
  if (mode === 'scroll' && !document.getElementById('scroll-view').innerHTML) renderScroll();
  if (mode === 'present') { currentSlide = 0; renderPresentSlide(); }
}

function nextSlide() {
  if (currentSlide < slides.length - 1) { currentSlide++; renderPresentSlide(); }
}
function prevSlide() {
  if (currentSlide > 0) { currentSlide--; renderPresentSlide(); }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Keyboard navigation in present mode
document.addEventListener('keydown', function(e) {
  if (currentMode !== 'present') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
});

// Init
renderGallery();
</script>
</body>
</html>
