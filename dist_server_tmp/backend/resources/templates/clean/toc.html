<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:var(--background);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;">

  <!-- 页头 -->
  <div style="position:absolute;top:80px;left:160px;z-index:2;">
    <h2 style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:32px;font-weight:700;color:var(--primary);margin:0;">{{TOC_TITLE}}</h2>
  </div>

  <!-- 章节列表 -->
  <div style="position:absolute;top:180px;left:160px;right:160px;z-index:2;display:flex;flex-direction:column;gap:24px;">
    {{#CHAPTERS}}
    <div style="display:flex;align-items:baseline;gap:12px;">
      <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;font-weight:400;color:var(--secondary);min-width:28px;">{{num}}.</span>
      <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;color:var(--primary);">{{title}}</span>
    </div>
    {{/CHAPTERS}}
  </div>

  <!-- 页码（右下角） -->
  <div style="position:absolute;bottom:40px;right:60px;z-index:3;display:flex;align-items:center;gap:8px;">
    <div style="width:4px;height:4px;border-radius:50%;background:var(--primary);"></div>
    <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--secondary);opacity:0.5;">{{PAGE_NUM}} / {{TOTAL_PAGES}}</span>
  </div>

</div>
