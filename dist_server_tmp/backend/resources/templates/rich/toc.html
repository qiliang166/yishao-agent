<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:var(--background);font-family:'DM Sans',Inter,'PingFang SC','Microsoft YaHei',sans-serif;">

  <!-- 第1层：顶部 accent 色条 -->
  <div style="position:absolute;top:0;left:0;width:100%;height:4px;background:var(--accent);z-index:5;"></div>

  <!-- 第2层：页头 -->
  <div style="position:absolute;top:60px;left:80px;right:80px;z-index:2;">
    <h2 style="font-family:'DM Sans',Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:32px;font-weight:700;color:var(--primary);margin:0 0 8px 0;">{{TOC_TITLE}}</h2>
    <div style="width:40px;height:3px;background:var(--accent);border-radius:2px;"></div>
  </div>

  <!-- 第3层：章节列表 -->
  <div style="position:absolute;top:180px;left:80px;right:80px;bottom:80px;z-index:2;display:flex;flex-direction:column;gap:18px;">
    {{#CHAPTERS}}
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--chart_color);display:flex;align-items:center;justify-content:center;">
        <span style="font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:#ffffff;">{{num}}</span>
      </div>
      <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;color:var(--primary);">{{title}}</span>
    </div>
    {{/CHAPTERS}}
  </div>

  <!-- 第4层：页码（右下角） -->
  <div style="position:absolute;bottom:40px;right:60px;z-index:3;display:flex;align-items:center;gap:8px;">
    <div style="width:6px;height:6px;border-radius:50%;background:var(--accent);"></div>
    <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;color:var(--secondary);">{{PAGE_NUM}} / {{TOTAL_PAGES}}</span>
  </div>

</div>
