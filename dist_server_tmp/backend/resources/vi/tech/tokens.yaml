# Tech Cyber — Dark Mode Design Tokens
# 程序解析用，所有色值/字号/间距的精确数值
# 颜色变量: {{primary}}, {{primary_rgb}}, {{accent}}, {{chart_0}}, 等

# 当前激活的色系（兼容字段）
color_scheme: cyber-cyan

# 文档模板映射 — 从 chart_colors 引用，避免破坏13色码结构
document_colors:
  header_blue: "{{chart_0}}"
  header_bronze: "{{chart_1}}"
  text_rgb: "241,245,249"
  white: "#ffffff"

color_schemes:
  cyber-cyan:
    label: "赛博青"
    primary: "#0a1628"
    secondary: "#132240"
    accent: "#22d3ee"
    background: "#060d18"
    text: "#f1f5f9"
    card_bg: "#0f1d33"
    chart_colors:
      - "#22d3ee"
      - "#6366f1"
      - "#a78bfa"
      - "#f59e0b"
      - "#34d399"
    semantic:
      positive: "#22d3ee"
      negative: "#f87171"
    persona_hint: "深海暗底（#0a1628）与电光青（#22d3ee）碰撞出赛博科技感。深蓝卡片与发光青色强调营造沉浸式暗色体验。青色占比≤10%。"
  neon-green:
    label: "霓虹绿"
    primary: "#0a0f0a"
    secondary: "#132013"
    accent: "#39ff14"
    background: "#050805"
    text: "#e8f5e9"
    card_bg: "#0f1a0f"
    chart_colors:
      - "#39ff14"
      - "#00e676"
      - "#76ff03"
      - "#b2ff59"
      - "#69f0ae"
    semantic:
      positive: "#39ff14"
      negative: "#ff5252"
    persona_hint: "极致暗黑底（#0a0f0a）与霓虹绿（#39ff14）模拟终端/黑客帝国视觉。绿色发光主色占比≤10%，保留大面积黑色空间。"
  plasma-purple:
    label: "等离子紫"
    primary: "#0f0720"
    secondary: "#1a1038"
    accent: "#c084fc"
    background: "#080412"
    text: "#ede9fe"
    card_bg: "#150d2e"
    chart_colors:
      - "#c084fc"
      - "#a78bfa"
      - "#818cf8"
      - "#e879f9"
      - "#f472b6"
    semantic:
      positive: "#a78bfa"
      negative: "#fb7185"
    persona_hint: "深紫暗底（#0f0720）与等离子紫（#c084fc）打造未来感视觉。靛蓝/紫罗兰渐变辅助图表，营造神秘科技氛围。"
  amber-terminal:
    label: "琥珀终端"
    primary: "#0f0d0a"
    secondary: "#1c1810"
    accent: "#fbbf24"
    background: "#080706"
    text: "#fef3c7"
    card_bg: "#17140d"
    chart_colors:
      - "#fbbf24"
      - "#f59e0b"
      - "#d97706"
      - "#fcd34d"
      - "#fde68a"
    semantic:
      positive: "#fbbf24"
      negative: "#ef4444"
    persona_hint: "复古终端琥珀色（#fbbf24）在深黑底色上的复古未来主义。暖金色调唤起CRT显示器时代的怀旧科技感。"
  crimson-matrix:
    label: "赤红矩阵"
    primary: "#0d0508"
    secondary: "#1a0d12"
    accent: "#ff3333"
    background: "#080304"
    text: "#fce4e4"
    card_bg: "#150a0f"
    chart_colors:
      - "#ff3333"
      - "#ff6666"
      - "#ff9999"
      - "#ffcccc"
      - "#cc0000"
    semantic:
      positive: "#ff3333"
      negative: "#ff0000"
    persona_hint: "暗红底（#0d0508）与赤红（#ff3333）构建高强度视觉冲击。红黑色调传达紧迫/关键/警告氛围，适合安全/攻防主题。"
  rainbow-spectrum:
    label: "彩虹光谱"
    primary: "#0f0f1a"
    secondary: "#1a1a2e"
    accent: "#ff6bd6"
    background: "#0a0a14"
    text: "#f0e6ff"
    card_bg: "#151528"
    chart_colors:
      - "#ff4444"
      - "#ff8c00"
      - "#ffd700"
      - "#44dd44"
      - "#44bbff"
      - "#8888ff"
      - "#cc66ff"
    semantic:
      positive: "#44dd44"
      negative: "#ff4444"
    persona_hint: "深邃黑底（#0a0a14）与七色彩虹碰撞出赛博朋克美学。红橙黄绿蓝靛紫全色域图表，鲜艳霓虹色点亮暗色背景每一寸空间。"

typography:
  heading_font: "Space Grotesk, Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  body_font: "JetBrains Mono, 'SF Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif"
  cover_title:
    size: "58-65px"
    weight: 700
  page_title:
    size: "36-44px"
    weight: 700
  card_title:
    size: "20-24px"
    weight: 600
  body:
    size: "15-18px"
    weight: 400
  caption:
    size: "12-14px"
    weight: 400
  line_height:
    heading: 1.15-1.25
    body: 1.6-1.8
  letter_spacing:
    heading: "0.5~1px"

card_style:
  border_radius: 8
  shadow: "0 4px 16px rgba(0,0,0,0.4)"
  border: "1px solid rgba({{text_rgb}}, 0.08)"
  gap: 24
  left_stripe_width: 3

gradients:
  hero_bg: "linear-gradient(135deg, {{primary}} 0%, {{secondary}} 100%)"
  card_highlight: "linear-gradient(180deg, {{card_bg}} 0%, {{primary}} 100%)"

elevation:
  shadow_sm: "0 2px 4px rgba(0,0,0,0.3)"
  shadow_md: "0 4px 16px rgba(0,0,0,0.4)"
  shadow_lg: "0 12px 40px rgba(0,0,0,0.6)"

slide_type_overrides:
  cover:
    card_bg: "{{primary}}"
    text: "#ffffff"
    heading_scale: 1.3
    layout: full_bleed
    no_card_container: true
  quote:
    card_bg: "{{primary}}"
    text: "#ffffff"
    body_font_style: "italic"
    layout: single_focus
  data:
    heading_scale: 0.9
    layout: dashboard
  section:
    background: "{{primary}}"
    text: "#ffffff"
    layout: full_bleed
  summary:
    background: "{{primary}}"
    text: "#ffffff"
    heading_scale: 1.1
    layout: full_bleed
    copyright: "© YYYY Company Name. All rights reserved."
    copyright_size: "11-12px"
    copyright_opacity: 0.4-0.5
  content:
    background: "{{background}}"
    layout: mixed_grid
  document:
    page_width: 794
    page_height: 1123
    page_unit: "px"
    print_width: 210
    print_height: 297
    print_unit: "mm"
    background: "{{background}}"
    layout: single_focus
    no_card_container: true
    table_border: "1px solid rgba({{text_rgb}}, 0.12)"
    cell_border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_font_size: "12-13px"
    data_font_size: "12px"
    label_font_size: "13px"
    footer_font_size: "11-12px"
    min_row_height: 26
    print_margin: "12mm 14mm"
    decoration_circle_opacity: "0.03-0.05"
    accent_stripe_height: 5

layout_types:
  - id: full_bleed
    cards: "1-3"
    description: "垂直居中，全屏"
    use: "封面、章节分隔、总结"
  - id: three_column
    cards: 3
    description: "水平等分，每栏 ~373px"
    use: "并列要点、三大优势"
  - id: two_column
    cards: 2
    description: "水平等分，每栏 ~550px"
    use: "对比分析、优劣对比"
  - id: two_column_asymmetric
    cards: 2
    description: "左宽 62% + 右窄 38%"
    use: "主次内容、问题+方案"
  - id: dashboard
    cards: "3-5"
    description: "顶行 metric 卡 + 底行 summary"
    use: "数据总览、KPI 展示"
  - id: mixed_grid
    cards: "3-4"
    description: "顶行 hero(全宽) + 底行 2-3 小卡"
    use: "核心观点+支撑论据"
  - id: hero_grid
    cards: "2-4"
    description: "左 hero 大卡 + 右 1-2 小卡堆叠"
    use: "论点+数据佐证"
  - id: single_focus
    cards: 1
    description: "居中大卡 ~900px"
    use: "核心结论、金句"
  - id: timeline
    cards: "2-5"
    description: "水平排列，步骤节点+连接线"
    use: "流程步骤、时间线"
  - id: horizontal_split
    cards: "3-4"
    description: "顶全宽 hero + 底行 2-3 小卡"
    use: "标题+支撑指标"

card_roles:
  - role: hero
    visual: "大卡，大面积，核心信息"
    required: [title, body]
    optional: [chart]
  - role: metric
    visual: "居中大数字/进度条，顶部短色条"
    required: [chart]
    optional: []
  - role: card_0
    visual: "标准卡，色条(chart_colors[0])"
    required: [title or body]
    optional: [chart]
  - role: card_1
    visual: "标准卡，色条(chart_colors[1])"
    required: [title or body]
    optional: [chart]
  - role: card_2
    visual: "标准卡，色条(chart_colors[2])"
    required: [title or body]
    optional: [chart]
  - role: card_3
    visual: "标准卡，色条(chart_colors[3])"
    required: [title or body]
    optional: [chart]
  - role: card_4
    visual: "标准卡，色条(chart_colors[4])"
    required: [title or body]
    optional: [chart]
  - role: left
    visual: "钢蓝顶条 + ▲ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比左/正面/优势"
  - role: right
    visual: "铜陶顶条 + ▼ 前缀"
    required: [title, body]
    optional: [chart]
    use: "双栏对比右/反面/劣势"
  - role: summary
    visual: "全宽浅色/半透明卡"
    required: [title or body]
    optional: [chart]
    use: "数据总结、页面收尾"
  - role: step_N
    visual: "圆形编号 + 标题 + 描述"
    required: [title, body]
    optional: []
    use: "时间线步骤 1~5"

decoration:
  accent_stripe: "3px solid {{accent}}"
  title_underline: "40×2px {{accent}}"
  page_dot: "5px {{accent}}"
  layers: ["背景层", "网格纹理层", "结构层", "内容层", "发光层"]
  types:
    - id: type_a
      name: "矩阵网格"
      description: "细网格纹理 + 右上角发光圆 + 顶部色条 + 标题短线 + 页码"
    - id: type_b
      name: "数据流"
      description: "对角虚线 + 圆点矩阵 + 发光边框"
    - id: type_c
      name: "端子界面"
      description: "代码行装饰 + 矩形边框 + 光标闪烁效果"

icons:
  style: "outline"
  stroke_width: "1.5px"
  card_size: 20
  hero_size: 36
  metric_size: 16
  color_rule: "跟随所在卡片的 chart_color, opacity: 0.85"

illustrations:
  label_align: "text-anchor=middle, label_x=graphic_cx"
  label_spacing: "≥22px from graphic bottom to label baseline"
  guide_spacing: "≥20px"
  min_stroke: "1px"
  min_font: "14px"

quality_checklist:
  - "5 层结构完整"
  - "≥3 个 SVG 元素"
  - "≥4 种不同 chart_color"
  - "≥1 个半透明几何装饰"
  - "每卡: SVG图标 + 标题 + 正文"
  - "数字→图表形态"
  - "顶部 accent 色条(3px)"
  - "标题短线(40×2px)"
  - "页码(dot + 页号)"
  - "标题 primary 色"
  - "正文 text 色"
  - "卡片 card_bg 色"
  - "背景 background 色"
  - "字体 typography token"
  - "圆角 8px"
  - "阴影 elevation token"
  - "插图标签居中"
  - "插图间距 ≥22px"
  - "插图字号 ≥14px"
  - "SVG描边 ≥1px"
  - "封面/总结无卡片容器"
  - "色条轮换"

font_thresholds:
  slide_title: { min: 28, max: 44 }
  card_title: { min: 18, max: 32 }
  body: { min: 14, max: 20 }
  label: { min: 14, max: 14 }
  absolute_min: 14

safe_area:
  x_min: 40
  y_min: 28
  y_max: 710

visual_richness:
  min_svg_elements: 3
  min_colors: 4
  min_cards: 3
  min_decorations: 2
  min_layers: 5

block_types:
  header:
    description: "文档头部（LOGO/编号/日期），全宽合并，可选段落"
    colspan: full
    font_size: "12-14px"
    color: "rgba({{text_rgb}}, 0.55)"
    border_bottom: "1px solid rgba({{text_rgb}}, 0.08)"
    columns: "2-4"
  title:
    description: "文档主标题，hero 渐变背景 + accent 下划线，必有段落"
    colspan: full
    background: "linear-gradient(135deg, {{primary}} 0%, {{secondary}} 100%)"
    color: "#ffffff"
    font_size: "20-24px"
    font_weight: 700
    letter_spacing: "2-3px"
    border_bottom: "2px solid {{accent}}"
  info_block:
    description: "键值对信息表，标签列 + 值列，可选图片占位区"
    colspan: auto
    label_bg: "{{card_bg}}"
    label_color: "{{accent}}"
    label_weight: 600
    value_bg: "{{background}}"
    value_color: "{{text}}"
    font_size: "13-14px"
    image_placeholder_bg: "{{card_bg}}"
    image_placeholder_border: "1.5px dashed rgba({{text_rgb}}, 0.15)"
    image_placeholder_radius: 6
  table_block:
    description: "多列数据网格，含表头和交替行数据"
    colspan: auto
    header_bg_default: "{{chart_1}}"
    header_bg_alt_0: "{{chart_0}}"
    header_bg_alt_2: "{{chart_2}}"
    header_color: "#ffffff"
    header_weight: 600
    header_font_size: "12-13px"
    data_bg: "{{background}}"
    data_bg_alt: "rgba({{text_rgb}}, 0.02)"
    data_font_size: "12px"
    row_height: 26
    border: "1px solid rgba({{text_rgb}}, 0.06)"
    header_border_top: "2px solid rgba({{text_rgb}}, 0.1)"
    header_rotation: "chart_1 → chart_0 → chart_2"
  text_block:
    description: "自由段落文字，全宽合并"
    colspan: full
    background: "{{background}}"
    color: "{{text}}"
    font_size: "14-16px"
    line_height: 1.8
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  list_block:
    description: "编号或项目符号列表"
    colspan: full
    number_color: "{{accent}}"
    number_weight: 600
    number_size: "14px"
    item_color: "{{text}}"
    item_size: "14px"
    styles: ["ordered", "bullet", "checkbox"]
    border_top: "1px solid rgba({{text_rgb}}, 0.08)"
  closing:
    description: "文档收束区域（结论/签名/落款），可选段落"
    colspan: full
    background: "{{card_bg}}"
    color: "{{text}}"
    font_size: "13-14px"
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    layouts: ["center", "split"]
  footer:
    description: "文档底部声明区（版权/备注）"
    colspan: full
    background: "{{card_bg}}"
    color: "rgba({{text_rgb}}, 0.45)"
    font_size: "11-12px"
    line_height: 1.7
    border_top: "1.5px solid rgba({{text_rgb}}, 0.1)"
    align: center
