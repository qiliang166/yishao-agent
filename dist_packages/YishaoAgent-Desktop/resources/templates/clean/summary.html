<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:var(--background);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;">

  <!-- 内容层：居中 -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;z-index:1;">

    <!-- 总结标题 -->
    <h2 style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:36px;font-weight:700;letter-spacing:-0.5px;line-height:1.2;color:var(--primary);margin:0 0 40px 0;">{{SUMMARY_TITLE}}</h2>

    <!-- 要点列表 -->
    <div style="margin-bottom:48px;">
      {{#KEY_POINTS}}
      <p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px;font-weight:400;line-height:1.6;color:var(--text);margin:0 0 12px 0;">{{text}}</p>
      {{/KEY_POINTS}}
    </div>

    <!-- 联系方式 -->
    {{#CONTACT_INFO}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--secondary);opacity:0.5;margin:0 0 8px 0;">{{CONTACT_INFO}}</p>{{/CONTACT_INFO}}

    <!-- 版权声明 -->
    {{#COPYRIGHT}}<p style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:11px;color:var(--secondary);opacity:0.4;margin:0;">{{COPYRIGHT}}</p>{{/COPYRIGHT}}
  </div>

  <!-- 页码（右下角） -->
  <div style="position:absolute;bottom:40px;right:60px;z-index:3;display:flex;align-items:center;gap:8px;">
    <div style="width:4px;height:4px;border-radius:50%;background:var(--primary);"></div>
    <span style="font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--secondary);opacity:0.5;">{{PAGE_NUM}} / {{TOTAL_PAGES}}</span>
  </div>

</div>
